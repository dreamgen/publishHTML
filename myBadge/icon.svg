<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- App background gradient (Dark navy) -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a35" />
      <stop offset="100%" stop-color="#0f0f23" />
    </linearGradient>

    <!-- Badge gradient (Primary brand colors) -->
    <linearGradient id="badge-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Simple drop shadow for the badge -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Solid Background for App Icon (Squircle/Square) -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Badge Body -->
  <rect x="136" y="96" width="240" height="320" rx="32" fill="url(#badge-grad)" filter="url(#shadow)" />
  
  <!-- Badge Clip / Lanyard Hole -->
  <rect x="216" y="120" width="80" height="16" rx="8" fill="#1a1a35" />

  <!-- The User's Provided Symbol (I-Kuan Tao logo) -->
  <g transform="translate(256, 266)">
    <!-- Main Circle -->
    <circle cx="0" cy="0" r="64" fill="none" stroke="#ffffff" stroke-width="20" />
    
    <!-- Vertical Line (Extends past circle by 20 units) -->
    <line x1="0" y1="-84" x2="0" y2="84" stroke="#ffffff" stroke-width="20" stroke-linecap="round" />
    
    <!-- Left Dot -->
    <circle cx="-32" cy="0" r="16" fill="#ffffff" />
    
    <!-- Right Dot -->
    <circle cx="32" cy="0" r="16" fill="#ffffff" />
  </g>
</svg>
