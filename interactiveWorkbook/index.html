<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>互動題本 — 線上小組練習</title>
  <meta name="description" content="講師開課程、匯入題目（JSON）；學員以六碼代碼加入，分組即時作答、講師逐題投影比較">
  <meta name="theme-color" content="#123c58">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/interactiveWorkbook-192.svg">
  <link rel="apple-touch-icon" href="./icons/interactiveWorkbook-192.svg">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
  <style>
    :root {
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      color: #163047;
      background: #f1f5f9;
      font-size: 20px;
      line-height: 1.65
    }

    * { box-sizing: border-box }
    body { margin: 0 }
    button, input, select, textarea { font: inherit }
    button, select, input { min-height: 54px }

    button {
      border: 1px solid #b6c6d2;
      background: white;
      color: #163047;
      border-radius: 9px;
      padding: 10px 20px;
      cursor: pointer;
      font-weight: 650
    }

    button:hover { background: #e7eff6 }
    button.primary { background: #124e73; color: white; border-color: #124e73 }
    button.danger { color: #a32626; border-color: #c88 }
    button:disabled { opacity: .5; cursor: not-allowed }
    button.small { padding: 6px 12px; min-height: 38px; font-size: .85rem }
    button.link { border: 0; background: none; text-decoration: underline; padding: 4px 8px; min-height: 40px }

    input, select, textarea {
      width: 100%;
      border: 1.5px solid #91a9b9;
      border-radius: 7px;
      background: white;
      padding: 10px 12px;
      color: #163047
    }

    textarea { min-height: 112px; resize: vertical; line-height: 1.65 }
    label { display: block; font-weight: 600; margin: 15px 0 7px }
    input[type=checkbox] { width: 26px; min-height: 26px; height: 26px; accent-color: #124e73 }
    input:focus, textarea:focus, select:focus, button:focus-visible { outline: 3px solid #d0911d; outline-offset: 3px }

    header {
      background: #123c58;
      color: white;
      padding: 20px max(24px, calc((100vw - 1280px)/2));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px
    }

    header b { font-size: 1.4rem }
    header small { display: block; color: #d4e5ed }
    .wrap { max-width: 1280px; margin: auto; padding: 28px 24px 120px }
    .login { max-width: 650px; margin: 30px auto }

    .card {
      background: white;
      border: 1px solid #d7e0e7;
      border-radius: 13px;
      padding: 28px;
      margin-bottom: 24px
    }

    .eyebrow { color: #176184; font-weight: 700; letter-spacing: .08em; font-size: .85rem }
    h1 { font-size: 1.9rem; line-height: 1.35; margin: 12px 0 }
    h2 { font-size: 1.35rem; margin: 8px 0 14px }
    h3 { font-size: 1.12rem }
    p { margin: 10px 0 20px }
    .muted { color: #526b7b; font-size: .9rem }
    .toolbar, .actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center }
    .toolbar select { width: auto; max-width: 100%; flex: 1 }
    .tabs { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin-bottom: 24px }
    .tabs button { text-align: left; padding: 12px }
    .tabs span { display: block; font-size: .85rem }
    .tabs .active { background: #124e73; color: white }
    .tabs button:disabled { opacity: .7; background: #e5eaf0; color: #526576 }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px }
    .notice { background: #eef5fa; border-left: 5px solid #26799d; padding: 16px 20px; margin: 15px 0 }
    .warn { background: #fff6e5; border-left-color: #d0911d }
    .data-table { width: 100%; border-collapse: collapse; margin: 18px 0 }
    .data-table th, .data-table td { text-align: left; border-bottom: 1px solid #c7d6df; padding: 12px; vertical-align: top }
    .data-table th { background: #e9f1f6 }
    .table-scroll { overflow-x: auto }
    .row-card { border: 1px solid #cad8e1; padding: 18px; border-radius: 8px; margin: 16px 0 }
    .row-grid { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 15px }
    .badge { display: inline-block; border-radius: 5px; background: #e5eef4; padding: 3px 10px; font-size: .85rem }

    .savebar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 14px 24px;
      background: #fffffff5;
      border-top: 1px solid #bbcbd6;
      display: flex;
      justify-content: center;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      z-index: 5
    }

    .choice {
      display: flex;
      gap: 13px;
      align-items: flex-start;
      padding: 16px;
      border: 1px solid #adbfce;
      border-radius: 8px;
      margin: 12px 0;
      min-width: 0
    }

    .choice:has(:checked) { background: #e9f3f8; border-color: #124e73 }
    .choice>span { flex: 1; min-width: 0; overflow-wrap: anywhere }
    input[type=radio], input[type=checkbox] { width: 26px; height: 26px; min-height: 26px; flex: 0 0 26px; padding: 0; margin: 3px 0; accent-color: #124e73 }

    #message {
      position: fixed;
      right: 20px;
      top: 15px;
      max-width: min(600px, 90vw);
      background: #123c58;
      color: white;
      border-radius: 10px;
      padding: 0;
      z-index: 100;
      box-shadow: 0 5px 25px #0003
    }

    #message:not(:empty) { padding: 18px 24px }
    .answer { white-space: pre-wrap; overflow-wrap: anywhere }
    .empty { color: #697d8b; font-style: italic }
    .comparison th:first-child { min-width: 180px }
    .comparison td { min-width: 280px; max-width: 560px }
    .status-line { margin: 12px 0; color: #476376 }
    .form-field, .grid, .row-grid, .grid>*, .row-grid>* { min-width: 0 }
    .form-field input, .form-field textarea, .form-field select { max-width: 100%; min-width: 0 }
    .manage h2 { margin-top: 0 }
    .manage p { margin-bottom: 14px }
    .list-item { margin: 14px 0 }
    .waiting { text-align: center; padding: 60px 24px }
    .exercise-gates { display: grid; gap: 12px; margin: 24px 0 }

    .gate-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 16px;
      background: #eef4f8;
      border-radius: 9px
    }

    .gate-row button { flex-shrink: 0 }

    /* 加入代碼 */
    .code-display {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: clamp(34px, 7vw, 56px);
      font-weight: 700;
      letter-spacing: .22em;
      color: #124e73;
      background: #eef5fa;
      border: 2px dashed #76a3bd;
      border-radius: 12px;
      padding: 18px 12px;
      text-align: center;
      margin: 16px 0;
      overflow-wrap: anywhere
    }

    .code-input {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 1.5rem;
      letter-spacing: .2em;
      text-transform: uppercase
    }

    .course-list { display: grid; gap: 10px; margin: 14px 0 }

    .course-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      background: #eef4f8;
      border-radius: 9px;
      flex-wrap: wrap
    }

    .course-item b { overflow-wrap: anywhere }
    .course-item code { font-family: ui-monospace, Menlo, Consolas, monospace; letter-spacing: .15em; font-weight: 700 }
    .seg { display: flex; gap: 0; margin-bottom: 18px; border: 1px solid #b6c6d2; border-radius: 9px; overflow: hidden }
    .seg button { border: 0; border-radius: 0; flex: 1 }
    .seg button.active { background: #124e73; color: white }

    /* 投影模式 */
    .projection header, .projection .manage, .projection .tabs, .projection .context { display: none }
    .projection .wrap { max-width: none; padding: 28px }
    .projection { font-size: 24px; background: white }
    .projection .projection-tools { position: sticky; top: 0; background: white; padding: 12px 0; z-index: 4 }
    .projection h1 { font-size: 2rem }
    .projection .card { border: 0; padding: 0 }
    .projection .comparison td { min-width: 330px }

    /* QR 加入畫面 */
    .join-screen {
      position: fixed;
      inset: 0;
      width: 100vw;
      max-width: none;
      height: 100dvh;
      max-height: none;
      margin: 0;
      border: 0;
      padding: 22px 36px;
      background: #fff;
      color: #163047;
      overflow: auto;
      font-size: 20px
    }

    .join-screen::backdrop { background: white }
    .join-top { display: flex; justify-content: space-between; align-items: center; gap: 16px }
    .join-top strong { font-size: 1.3rem }
    .join-body { text-align: center; max-width: 1200px; margin: 12px auto }
    .join-body h1 { font-size: clamp(28px, 3vw, 48px); margin: 10px 0 }
    .join-body p { margin: 8px 0; font-size: clamp(20px, 2vw, 28px) }

    #qr-picture {
      margin: 10px auto;
      width: min(46vh, 420px, 80vw);
      min-height: 150px;
      display: flex;
      align-items: center;
      justify-content: center
    }

    #qr-picture canvas, #qr-picture svg { display: block; width: 100%; height: auto; background: white }
    .join-address { font-weight: 700; overflow-wrap: anywhere; font-size: 1rem }

    @media(max-width:700px) {
      :root { font-size: 19px }
      .wrap { padding: 18px 14px 24px }
      .card { padding: 20px }
      .grid, .row-grid { grid-template-columns: minmax(0, 1fr); gap: 12px }
      .tabs { grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 6px }
      .tabs button { padding: 8px 6px; font-size: .85rem; min-width: 0; overflow-wrap: anywhere }
      .tabs span { display: none }
      header { padding: 16px }
      header small { display: none }
      h1 { font-size: 1.6rem }
      .toolbar select { width: 100% }
      .projection { font-size: 21px }
      .gate-row { flex-direction: column; align-items: stretch }
      input[type=date] { appearance: none; min-width: 0; width: 100% }
      .savebar {
        position: static;
        padding: 16px 14px max(16px, env(safe-area-inset-bottom));
        border-radius: 10px;
        margin-top: 12px
      }
      .savebar #save-state { flex-basis: 100%; text-align: center; overflow-wrap: anywhere }
      .savebar button { flex: 1 1 130px }
      textarea, input { scroll-margin-block: 24px }
      .join-screen { padding: 16px }
      .join-top strong { font-size: 1rem }
      .join-body p { font-size: 20px }
    }

    @media print {
      header, .tabs, .toolbar, .savebar, .manage, .projection-tools { display: none !important }
      .wrap { padding: 0 }
      .card { break-inside: avoid }
      .comparison td { min-width: 0 }
    }
  </style>
</head>

<body>
  <div id="app">
    <header>
      <div><b>互動題本</b><small>線上小組練習</small></div>
    </header>
    <main class="wrap">
      <div class="card">
        <p>載入中…</p>
      </div>
    </main>
  </div>
  <div id="message" role="status" aria-live="polite"></div>
  <script type="module" src="./app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => { }));
    }
  </script>
</body>

</html>
