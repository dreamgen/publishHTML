<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>互動題本 — 線上小組練習</title>
  <meta name="description" content="講師開課程、匯入題目（JSON）；學員以六碼代碼加入，分組即時作答、講師逐題投影比較">
  <meta name="theme-color" content="#123c58">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/interactiveWorkbook-192.svg">
  <link rel="apple-touch-icon" href="./icons/interactiveWorkbook-192.svg">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
  <link rel="stylesheet" href="./styles/base.css">
  <link rel="stylesheet" href="./styles/group.css">
  <link rel="stylesheet" href="./styles/editlock.css">
  <link rel="stylesheet" href="./styles/projection.css">
  <link rel="stylesheet" href="./styles/editor.css">
</head>

<body>
  <div id="app">
    <header>
      <div><b>互動題本</b><small>線上小組練習</small></div>
    </header>
    <main class="wrap">
      <div class="card">
        <p id="boot-status">載入中…</p>
      </div>
    </main>
  </div>
  <div id="message" role="status" aria-live="polite"></div>
  <script type="module" src="./app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => { }));
    }

    // 看門狗：app.js 若因為 CDN 被擋、網路不通或快取損毀而沒能啟動，
    // 不要讓畫面永遠停在「載入中…」，改為顯示原因與自救按鈕。
    window.__iwBooted = false;
    window.__iwReset = async function () {
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map((r) => r.unregister()));
        }
        if (window.caches) {
          const keys = await caches.keys();
          await Promise.all(keys.map((k) => caches.delete(k)));
        }
      } catch (e) { /* 清不掉就直接重載 */ }
      location.reload();
    };
    setTimeout(function () {
      if (window.__iwBooted) return;
      var el = document.querySelector('#boot-status');
      if (!el) return;
      el.parentElement.innerHTML =
        '<div class="eyebrow">載入失敗</div>'
        + '<h1>沒辦法啟動互動題本</h1>'
        + '<p>程式已下載，但連不上即時資料庫，常見原因有：</p>'
        + '<ul><li>目前沒有網路，或校內／公司網路擋住了 Google 服務</li>'
            + '<li>瀏覽器的擋廣告或隱私擴充功能封鎖了 <code>gstatic.com</code>、<code>googleapis.com</code></li>'
            + '<li>之前存下的舊版快取壞掉了</li></ul>'
        + '<div class="toolbar"><button class="primary" onclick="location.reload()">重新整理</button>'
        + '<button onclick="window.__iwReset()">清除快取並重新載入</button></div>'
        + '<p class="muted">若在教室 Wi-Fi 下反覆失敗，請改用手機網路或請網管放行 Google 服務網域。</p>';
    }, 20000);   // 最後一道防線：app.js 自己會在 12 秒先報告連線問題，這裡只處理「app.js 根本沒跑起來」
  </script>
</body>

</html>
