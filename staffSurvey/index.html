<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- 只允許載入本站檔案、禁止對外連線：名冊與問卷資料不會被送出這支手機 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>服務人員調查</title>
<meta name="description" content="天達堂服務人員名冊查詢與問卷調查：匯入名冊 xlsx 後以 PIN 加密存在手機，可搜尋人員、查看出席與服務紀錄、直接填寫排班問卷，並把結果寫回名冊 xlsx；資料不上傳">

<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./icons/staffSurvey-192.svg">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/staffSurvey-192.png">
<link rel="apple-touch-icon" href="./icons/staffSurvey-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="服務調查">
<meta name="theme-color" content="#7a4b1e">

<style>
:root{
  --bg:#faf6f0; --card:#ffffff; --ink:#2b2118; --muted:#7a6753; --line:#e4d8c8; --soft:#f4ece1;
  --accent:#7a4b1e; --accent-ink:#ffffff; --hit:#fbe9d2; --ok:#2f6b3a; --ok-bg:#e3f1e5; --warn:#a4461a; --warn-bg:#fbe6da; --focus:#c47a2c;
  --info:#1f4e78; --info-bg:#e3edf6; --green-bg:#e2efda;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1c1814; --card:#26201a; --ink:#efe6da; --muted:#b09c86; --line:#3d342a; --soft:#2f2821;
    --accent:#d79a5b; --accent-ink:#1c1814; --hit:#3b2e20; --ok:#7fbf88; --ok-bg:#223326; --warn:#f0a070; --warn-bg:#3a2419; --focus:#e0a360;
    --info:#8ab8e0; --info-bg:#1d2a36; --green-bg:#243222;
  }
}
:root[data-theme="dark"]{
  --bg:#1c1814; --card:#26201a; --ink:#efe6da; --muted:#b09c86; --line:#3d342a; --soft:#2f2821;
  --accent:#d79a5b; --accent-ink:#1c1814; --hit:#3b2e20; --ok:#7fbf88; --ok-bg:#223326; --warn:#f0a070; --warn-bg:#3a2419; --focus:#e0a360;
  --info:#8ab8e0; --info-bg:#1d2a36; --green-bg:#243222;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "PingFang TC","Microsoft JhengHei","Noto Sans TC","Noto Sans CJK TC",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;min-height:100dvh}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.muted{color:var(--muted)}
a{color:var(--accent);font-weight:600}
.small{font-size:14px}
.tiny{font-size:12px}

/* 頂部列 */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top-in{max-width:720px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.top h1{font-size:18px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--accent)}
.iconbtn{border:0;background:transparent;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--ink);flex:none}
.iconbtn:active{background:var(--soft)}
.iconbtn svg{width:22px;height:22px}

/* 底部導覽 */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;font-size:12px;color:var(--muted)}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--accent);font-weight:700}
.has-nav{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.has-bar{padding-bottom:calc(88px + env(safe-area-inset-bottom))}

/* 元件 */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0}
.card h2{font-size:16px;margin:0 0 8px;color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);padding:10px 14px;border-radius:12px;font-size:15px;font-weight:600;min-height:44px;text-decoration:none;color:var(--ink)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
.btn.block{display:flex;width:100%}
.btn svg{width:18px;height:18px}
.btn:disabled{opacity:.5}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns>.btn{flex:1 1 auto}
.field{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);font-size:16px;min-height:44px}
textarea.field{min-height:84px;resize:vertical}
.field:focus,.btn:focus-visible,.iconbtn:focus-visible,.chip:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.lbl{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap;font-weight:600}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.info{background:var(--info-bg);color:var(--info)}
.pill.green{background:var(--green-bg);color:var(--ok)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px;min-height:36px;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.chip .n{opacity:.7;font-size:12px;margin-left:2px}

/* 鎖定畫面 */
.lock{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom));text-align:center}
.lock .logo{width:84px;height:84px;border-radius:20px;margin-bottom:12px}
.lock h1{font-size:22px;margin:0 0 4px;color:var(--accent)}
.lock p{margin:4px 0;max-width:340px}
.pinbox{width:100%;max-width:320px;margin-top:16px}
.pin{font-size:24px;letter-spacing:.4em;text-align:center}
.err{color:var(--warn);font-size:14px;min-height:1.4em;margin:6px 0}
.shield{display:flex;gap:8px;align-items:flex-start;text-align:left;background:var(--soft);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--muted);max-width:340px;margin-top:18px}
.shield svg{flex:none;width:18px;height:18px;margin-top:2px;color:var(--ok)}

/* 名冊清單 */
.search{position:relative;margin:12px 0 8px}
.search input{padding-left:40px;background:var(--card)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted)}
.search .clear{position:absolute;right:4px;top:50%;transform:translateY(-50%)}
.stat-line{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin:6px 2px}
.list{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;width:100%;text-align:left}
.row:active{background:var(--soft)}
.row.src-green{border-left:4px solid #8fbf7a}
.row.src-ref{border-left:4px solid var(--muted)}
.row.src-new{border-left:4px solid var(--info)}
.avatar{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--hit);color:var(--accent);font-size:17px}
.avatar.k{background:var(--info-bg);color:var(--info)}
.row .main{flex:1;min-width:0}
.row .nm{font-weight:700;font-size:17px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row .sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .right{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.empty{text-align:center;color:var(--muted);padding:32px 12px}
.empty svg{width:56px;height:56px;opacity:.5}

/* 人員資料 */
.hero{display:flex;gap:14px;align-items:center;margin:14px 0 4px}
.hero .avatar{width:56px;height:56px;font-size:24px}
.hero h2{margin:0;font-size:24px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:15px}
.kv dt{color:var(--muted);white-space:nowrap}
.kv dd{margin:0;word-break:break-word}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--soft);border-radius:10px;padding:8px 10px}
.tile b{display:block;font-size:20px;line-height:1.2}
.tile span{font-size:12px;color:var(--muted)}
.tile.zero b{color:var(--muted);font-weight:500}
.att{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.att .tile b{font-size:17px}
.bar-in{height:4px;background:var(--line);border-radius:2px;margin-top:4px;overflow:hidden}
.bar-in i{display:block;height:100%;background:var(--accent)}
.sticky-bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.sticky-bar .in{max-width:720px;margin:0 auto;display:flex;gap:8px;align-items:center}
.sticky-bar .in .btn{flex:1}

/* 問卷 */
.prog{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);flex:none}
.meter{width:70px;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.secnav{position:sticky;top:calc(61px + env(safe-area-inset-top));z-index:15;background:var(--bg);padding:6px 0;border-bottom:1px solid var(--line)}
.notice{background:var(--info-bg);color:var(--info);border-radius:12px;padding:10px 12px;font-size:14px;margin:12px 0}
.notice.warn{background:var(--warn-bg);color:var(--warn)}
.notice .btn{margin-top:8px;min-height:36px;padding:6px 12px}
section.sec{margin-top:22px;scroll-margin-top:120px}
.sec-h{display:flex;align-items:baseline;gap:10px;background:var(--accent);color:var(--accent-ink);padding:8px 14px;border-radius:10px;margin:0}
.sec-h .l{font-weight:700;font-size:18px}
.sec-h .t{font-weight:600;font-size:16px}
.sec-note{color:var(--muted);font-size:14px;margin:8px 4px 0}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.q.done{border-left:4px solid var(--ok)}
.q.hidden{display:none}
.q-h{display:flex;gap:8px;align-items:baseline;margin-bottom:8px}
.q-id{font-weight:700;color:var(--accent);flex:none}
.q-t{font-weight:600}
.q-cond{font-size:13px;color:var(--muted);margin-left:4px;font-weight:400}
.part-l{font-size:14px;color:var(--muted);margin:10px 0 4px}
.part-l:first-child{margin-top:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:6px 14px;user-select:none;-webkit-user-select:none;background:var(--card);min-height:42px;cursor:pointer}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .box{width:18px;height:18px;border:2px solid var(--muted);border-radius:4px;flex:none;display:grid;place-items:center}
.opt.radio .box{border-radius:50%}
.opt.on{background:var(--hit);border-color:var(--accent)}
.opt.on .box{border-color:var(--accent);background:var(--accent)}
.opt.on .box::after{content:"";width:6px;height:10px;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.opt.radio.on .box::after{width:6px;height:6px;border:0;border-radius:50%;background:var(--accent-ink);transform:none}
.opt:has(input:focus-visible){outline:2px solid var(--focus);outline-offset:2px}
.opts.months .opt{min-width:66px;justify-content:center;padding:6px 8px}
.fill{display:none;align-items:center;gap:6px;margin:8px 0 0}
.fill.show{display:flex}
.fill input{flex:1;min-width:0}
.fill input[type=number]{max-width:110px}
label.fld{display:block;margin:6px 0}
label.fld>span{display:block;font-size:14px;color:var(--muted);margin-bottom:3px}
.req{color:var(--warn)}
.inline{display:flex;align-items:center;gap:8px}
.inline input[type=number]{max-width:110px}
.grid{width:100%;border-collapse:collapse}
.grid th,.grid td{border-bottom:1px solid var(--line);padding:6px 2px;text-align:left}
.grid th{font-size:12px;color:var(--muted);font-weight:600}
.grid td.c,.grid th.c{text-align:center;width:1%;white-space:nowrap}
.seg{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;font-size:14px;min-height:38px}
.seg.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 10px}
@media (max-width:520px){.row3{grid-template-columns:1fr}}
.saved{font-size:12px;color:var(--muted);flex:none;min-width:5.5em;text-align:center}

/* 工具頁 */
.tools .card p{margin:4px 0 10px}
.tools .btns{margin-top:8px}
.srow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.srow:last-child{border-bottom:0}

/* 對話框與訊息 */
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;padding:16px}
@media (min-width:600px){.modal{align-items:center}}
.dlg{background:var(--card);color:var(--ink);border-radius:16px;padding:18px 16px 14px;width:100%;max-width:420px;max-height:85dvh;overflow:auto;margin-bottom:env(safe-area-inset-bottom)}
.dlg h3{margin:0 0 6px;font-size:18px}
.dlg .body{font-size:15px;color:var(--muted);white-space:pre-line}
.dlg .btns{margin-top:14px}
.msg{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px);z-index:60;text-align:center}
.msg.show{opacity:1}
.busy{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.35);display:grid;place-items:center}
.busy div{background:var(--card);padding:16px 20px;border-radius:12px;font-weight:600}
</style>
</head>
<body>
<div id="app"></div>
<div class="msg" id="msg" role="status" aria-live="polite"></div>
<input type="file" id="fileXlsx" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
<input type="file" id="fileJson" accept=".json,application/json" multiple hidden>
<input type="file" id="fileBackup" accept=".json,.ssbak,application/json" hidden>

<script src="./survey.js"></script>
<script src="./app.js"></script>
</body>
</html>
