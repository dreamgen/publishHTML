    function formatSize(bytes) {
      if (!bytes) return '';
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function formatDate(iso) {
      try {
        const d = new Date(iso);
        return d.toLocaleString('zh-TW', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
      } catch {
        return iso;
      }
    }

    function isValidHttpUrl(raw) {
      if (!raw || typeof raw !== 'string') return false;
      try {
        const u = new URL(raw.trim());
        return u.protocol === 'http:' || u.protocol === 'https:';
      } catch {
        return false;
      }
    }

    function getDomainLabel(rawUrl, fallback = 'htmlShare') {
      try {
        const u = new URL(rawUrl.trim());
        return u.hostname || fallback;
      } catch {
        return fallback;
      }
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function safeScriptJson(value) {
      return JSON.stringify(value)
        .replace(/</g, '\\u003c')
        .replace(/>/g, '\\u003e')
        .replace(/&/g, '\\u0026');
    }

    function withLineExternalParam(urlStr) {
      try {
        const u = new URL(urlStr);
        u.searchParams.set('openExternalBrowser', '1');
        return u.toString();
      } catch {
        return urlStr;
      }
    }

    // ── Canvas 1200×630 預覽圖工具 ──────────────────────────────────────
    function drawRoundRect(ctx, x, y, w, h, r) {
      const radius = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + w - radius, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
      ctx.lineTo(x + w, y + h - radius);
      ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
      ctx.lineTo(x + radius, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    function wrapCanvasText(ctx, text, maxWidth, maxLines) {
      const normalized = String(text || '').trim();
      if (!normalized) return [];
      const paragraphs = normalized.split(/\r?\n/);
      const lines = [];

      for (let pIdx = 0; pIdx < paragraphs.length; pIdx++) {
        const para = paragraphs[pIdx].trim();
        if (!para) continue;
        const tokens = para.match(/[A-Za-z0-9._:/-]+|\s+|./gu) || [];
        let current = '';

        const pushLine = (line) => {
          lines.push(line.trimEnd());
        };

        for (let i = 0; i < tokens.length; i++) {
          const token = tokens[i];
          if (!current && /^\s+$/.test(token)) continue;
          const candidate = current + token;
          if (ctx.measureText(candidate).width <= maxWidth) {
            current = candidate;
            continue;
          }

          if (current) {
            pushLine(current);
            if (lines.length >= maxLines) break;
            current = /^\s+$/.test(token) ? '' : token;
          }

          // 若單一長英文 token 自己就超過寬度，逐字切分避免溢出
          while (current && ctx.measureText(current).width > maxWidth) {
            let cut = current.length - 1;
            while (cut > 1 && ctx.measureText(current.slice(0, cut)).width > maxWidth) {
              cut--;
            }
            pushLine(current.slice(0, cut));
            if (lines.length >= maxLines) {
              current = '';
              break;
            }
            current = current.slice(cut);
          }

          if (lines.length >= maxLines) break;
        }

        if (current && lines.length < maxLines) {
          pushLine(current);
        }

        if (lines.length >= maxLines) {
          // 檢查是否有剩餘文字未顯示，若有則於最後一行加上省略號
          const consumed = lines.join('').length;
          if (consumed < normalized.replace(/\s+/g, '').length || pIdx < paragraphs.length - 1) {
            let last = lines[maxLines - 1];
            while (last.length > 1 && ctx.measureText(last + '…').width > maxWidth) {
              last = last.slice(0, -1);
            }
            lines[maxLines - 1] = last.trimEnd() + '…';
          }
          break;
        }
      }

      return lines.slice(0, maxLines);
    }

    function renderAutoOgCanvas(canvas, { title, description, badgeText, targetUrl, themeKey }) {
      const ctx = canvas.getContext('2d');
      const theme = OG_THEMES[themeKey] || OG_THEMES.cyan;
      const W = OG_WIDTH;
      const H = OG_HEIGHT;
      canvas.width = W;
      canvas.height = H;

      // 1. 背景漸層
      const bgGrad = ctx.createLinearGradient(0, 0, W, H);
      bgGrad.addColorStop(0, theme.bgFrom);
      bgGrad.addColorStop(1, theme.bgTo);
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, W, H);

      // 2. 柔和光暈裝飾
      const glow1 = ctx.createRadialGradient(W * 0.86, H * 0.14, 20, W * 0.86, H * 0.14, 440);
      glow1.addColorStop(0, theme.glow1);
      glow1.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = glow1;
      ctx.fillRect(0, 0, W, H);

      const glow2 = ctx.createRadialGradient(W * 0.14, H * 0.88, 20, W * 0.14, H * 0.88, 380);
      glow2.addColorStop(0, theme.glow2);
      glow2.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = glow2;
      ctx.fillRect(0, 0, W, H);

      // 3. 細微點陣網格紋理
      ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
      for (let gx = 40; gx < W; gx += 48) {
        for (let gy = 40; gy < H; gy += 48) {
          ctx.beginPath();
          ctx.arc(gx, gy, 1.5, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // 4. 玻璃質感主卡片框
      const padX = 56;
      const padY = 50;
      const cardW = W - padX * 2;
      const cardH = H - padY * 2;
      drawRoundRect(ctx, padX, padY, cardW, cardH, 32);
      ctx.fillStyle = 'rgba(15, 23, 42, 0.45)';
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.14)';
      ctx.stroke();

      // 卡片左側主題色條
      drawRoundRect(ctx, padX + 36, padY + 42, 8, cardH - 84, 4);
      ctx.fillStyle = theme.accent;
      ctx.fill();

      const contentX = padX + 74;
      const contentMaxW = cardW - 122;

      // 5. 頂部標籤與右側小字
      const badge = (badgeText || '').trim();
      let cursorY = padY + 58;
      if (badge) {
        ctx.font = '600 24px -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif';
        const textW = ctx.measureText(badge).width;
        const pillW = Math.min(textW + 44, contentMaxW * 0.7);
        drawRoundRect(ctx, contentX, cursorY - 12, pillW, 48, 24);
        ctx.fillStyle = theme.badgeBg;
        ctx.fill();
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = theme.badgeBorder;
        ctx.stroke();

        ctx.fillStyle = theme.badgeText;
        ctx.textBaseline = 'middle';
        ctx.fillText(badge, contentX + 22, cursorY + 12, pillW - 44);
      }

      ctx.font = '600 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
      ctx.fillStyle = 'rgba(226, 232, 240, 0.48)';
      ctx.textBaseline = 'middle';
      ctx.textAlign = 'right';
      ctx.fillText('htmlShare', padX + cardW - 44, cursorY + 12);
      ctx.textAlign = 'left';

      // 6. 標題文字
      const displayTitle = (title || '').trim() || getDomainLabel(targetUrl, '分享連結');
      const titleFontSize = displayTitle.length > 26 ? 48 : 56;
      ctx.font = `800 ${titleFontSize}px -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif`;
      ctx.fillStyle = '#f8fafc';
      ctx.textBaseline = 'top';
      const titleLines = wrapCanvasText(ctx, displayTitle, contentMaxW, 3);
      let textY = badge ? padY + 132 : padY + 106;
      const titleLineHeight = titleFontSize * 1.26;
      for (const line of titleLines) {
        ctx.fillText(line, contentX, textY);
        textY += titleLineHeight;
      }

      // 7. 介紹文字
      const displayDesc = (description || '').trim();
      if (displayDesc) {
        ctx.font = '400 29px -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif';
        ctx.fillStyle = 'rgba(226, 232, 240, 0.84)';
        const descLines = wrapCanvasText(ctx, displayDesc, contentMaxW, 3);
        let descY = Math.max(textY + 18, padY + 286);
        const maxDescBottom = padY + cardH - 102;
        for (const line of descLines) {
          if (descY + 34 > maxDescBottom) break;
          ctx.fillText(line, contentX, descY);
          descY += 42;
        }
      }

      // 8. 底部網域與行動按鈕
      const footerY = padY + cardH - 58;
      const domain = getDomainLabel(targetUrl, '線上服務連結');
      ctx.font = '500 23px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace';
      ctx.fillStyle = 'rgba(148, 163, 184, 0.9)';
      ctx.textBaseline = 'middle';
      ctx.fillText(domain, contentX, footerY, contentMaxW - 230);

      const ctaW = 196;
      const ctaH = 48;
      const ctaX = padX + cardW - 44 - ctaW;
      const ctaY = footerY - ctaH / 2;
      drawRoundRect(ctx, ctaX, ctaY, ctaW, ctaH, 24);
      ctx.fillStyle = theme.accent;
      ctx.fill();

      ctx.font = '700 22px -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", sans-serif';
      ctx.fillStyle = '#0f172a';
      ctx.textAlign = 'center';
      ctx.fillText('點擊開啟 ↗', ctaX + ctaW / 2, footerY + 1);
      ctx.textAlign = 'left';

      return canvas.toDataURL('image/jpeg', 0.88);
    }

    function renderUploadedOgFromDataUrl(rawDataUrl, fitMode = 'cover') {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = OG_WIDTH;
          canvas.height = OG_HEIGHT;
          const ctx = canvas.getContext('2d');

          ctx.fillStyle = '#0f172a';
          ctx.fillRect(0, 0, OG_WIDTH, OG_HEIGHT);

          const iw = img.naturalWidth || img.width;
          const ih = img.naturalHeight || img.height;
          if (!iw || !ih) {
            reject(new Error('無法取得圖片尺寸'));
            return;
          }

          if (fitMode === 'contain') {
            // 先用滿版模糊背景填滿畫布，再置中完整繪製原圖
            const coverScale = Math.max(OG_WIDTH / iw, OG_HEIGHT / ih);
            const bw = iw * coverScale;
            const bh = ih * coverScale;
            ctx.save();
            if ('filter' in ctx) ctx.filter = 'blur(28px) brightness(0.55)';
            ctx.drawImage(img, (OG_WIDTH - bw) / 2, (OG_HEIGHT - bh) / 2, bw, bh);
            ctx.restore();
            ctx.fillStyle = 'rgba(15, 23, 42, 0.38)';
            ctx.fillRect(0, 0, OG_WIDTH, OG_HEIGHT);

            const containScale = Math.min((OG_WIDTH - 48) / iw, (OG_HEIGHT - 36) / ih);
            const dw = iw * containScale;
            const dh = ih * containScale;
            ctx.drawImage(img, (OG_WIDTH - dw) / 2, (OG_HEIGHT - dh) / 2, dw, dh);
          } else {
            const coverScale = Math.max(OG_WIDTH / iw, OG_HEIGHT / ih);
            const dw = iw * coverScale;
            const dh = ih * coverScale;
            ctx.drawImage(img, (OG_WIDTH - dw) / 2, (OG_HEIGHT - dh) / 2, dw, dh);
          }

          resolve(canvas.toDataURL('image/jpeg', 0.85));
        };
        img.onerror = () => reject(new Error('圖片解碼失敗，請換一張圖片試試'));
        img.src = rawDataUrl;
      });
    }

    function readImageFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        if (!file) { reject(new Error('沒有選擇圖片')); return; }
        if (!/^image\/(jpeg|png|webp|gif)$/i.test(file.type) && !/\.(jpe?g|png|webp|gif)$/i.test(file.name || '')) {
          reject(new Error('請選擇 JPG、PNG、WebP 或 GIF 圖片'));
          return;
        }
        if (file.size > 15 * 1024 * 1024) {
          reject(new Error('原始圖片過大，請選擇 15MB 以下的圖片'));
          return;
        }
        const reader = new FileReader();
        reader.onload = (e) => resolve(e.target.result);
        reader.onerror = () => reject(new Error('讀取圖片失敗'));
        reader.readAsDataURL(file);
      });
    }

    // ── 產出轉頁專用 HTML 模板（關鍵：不使用 meta refresh，改用 JS 跳轉以確保 LINE/FB 爬蟲讀取 OG 標籤）
    function buildRedirectHtml({

      const lineScriptBlock = `

      if (redirectMode === 'iframe') {

    function createInitialRedirectState(seed = {}) {
      const meta = seed.shareMeta || {};
      return {
        targetUrl: meta.targetUrl || '',
        title: seed.title || '',
        description: meta.description || '',
        badgeText: meta.badgeText || '線上服務',
        themeKey: meta.themeKey && OG_THEMES[meta.themeKey] ? meta.themeKey : 'cyan',
        ogImageMode: meta.ogImageMode || 'auto', // 'auto' | 'upload' | 'url' | 'none'
        imageFit: meta.imageFit || 'cover',
        externalImageUrl: meta.ogImageUrl || '',
        redirectMode: meta.redirectMode || 'instant', // 'instant' | 'card' | 'iframe'
        openExternalInLine: Boolean(meta.openExternalInLine),
        autoDataUrl: '',
        uploadedRawDataUrl: '',
        uploadedDataUrl: '',
      };
    }

    function buildRedirectSubmission(state, { existingOgImageUrl = '' } = {}) {
      const targetUrl = (state.targetUrl || '').trim();
      if (!targetUrl) {
        throw new Error('請輸入要轉導的目標網址');
      }
      if (!isValidHttpUrl(targetUrl)) {
        throw new Error('請輸入有效的 http:// 或 https:// 網址');
      }

      const finalTitle = (state.title || '').trim() || getDomainLabel(targetUrl, '分享連結');
      const finalDesc = (state.description || '').trim();

      let ogImageSource = '';
      let ogImagePayload; // undefined = 不更動；string = 上傳新圖片；null = 清除既有圖片

      if (state.ogImageMode === 'auto') {
        let dataUrl = state.autoDataUrl;
        if (!dataUrl) {
          const canvas = document.createElement('canvas');
          dataUrl = renderAutoOgCanvas(canvas, {
            title: finalTitle,
            description: finalDesc,
            badgeText: state.badgeText,
            targetUrl,
            themeKey: state.themeKey,
          });
        }
        ogImageSource = '__HTMLSHARE_OG_IMAGE__';
        ogImagePayload = dataUrl;
      } else if (state.ogImageMode === 'upload') {
        if (state.uploadedDataUrl) {
          ogImageSource = '__HTMLSHARE_OG_IMAGE__';
          ogImagePayload = state.uploadedDataUrl;
        } else if (existingOgImageUrl) {
          ogImageSource = '__HTMLSHARE_OG_IMAGE__';
          ogImagePayload = undefined;
        } else {
          throw new Error('請先選擇或貼上要顯示的預覽圖片');
        }
      } else if (state.ogImageMode === 'url') {
        const extUrl = (state.externalImageUrl || '').trim();
        if (!isValidHttpUrl(extUrl)) {
          throw new Error('請輸入有效的外部圖片網址（https://...）');
        }
        ogImageSource = extUrl;
        if (existingOgImageUrl) ogImagePayload = null;
      } else {
        ogImageSource = '';
        if (existingOgImageUrl) ogImagePayload = null;
      }

      const inlineImageSrc = (state.ogImageMode === 'auto' || state.ogImageMode === 'upload')
        ? (ogImagePayload || existingOgImageUrl || '')
        : ogImageSource;

      const html = buildRedirectHtml({
        targetUrl,
        title: finalTitle,
        description: finalDesc,
        ogImageSource,
        inlineImageSrc,
        redirectMode: state.redirectMode,
        badgeText: state.badgeText,
        themeKey: state.themeKey,
        openExternalInLine: state.openExternalInLine,
      });

      const shareMeta = {
        type: 'redirect',
        targetUrl,
        description: finalDesc,
        badgeText: (state.badgeText || '').trim(),
        themeKey: state.themeKey,
        ogImageMode: state.ogImageMode,
        imageFit: state.imageFit,
        ogImageUrl: state.ogImageMode === 'url' ? (state.externalImageUrl || '').trim() : '',
        redirectMode: state.redirectMode,
        openExternalInLine: Boolean(state.openExternalInLine),
      };

      return {
        html,
        title: finalTitle,
        ogImage: ogImagePayload,
        shareMeta,
      };
    }

    // 讀取並驗證一個 .html 檔案，回傳檔案內容文字（供上傳與更新共用）
    function readHtmlFile(file) {
      return new Promise((resolve, reject) => {
        if (!file) { reject(new Error('沒有選擇檔案')); return; }
        if (!/\.(html?|htm)$/i.test(file.name) && file.type !== 'text/html') {
          reject(new Error('請選擇 .html 檔案')); return;
        }
        if (file.size > MAX_BYTES) {
          reject(new Error(`檔案過大（${formatSize(file.size)}），上限為 ${formatSize(MAX_BYTES)}`)); return;
        }
        const reader = new FileReader();
        reader.onload = (e) => resolve(e.target.result);
        reader.onerror = () => reject(new Error('讀取檔案失敗'));
        reader.readAsText(file);
      });
    }

    // ── 網址轉頁編輯器（供 UploadForm 與 UpdateModal 共用）─────────────────
    function RedirectEditor({ value, onChange, workerUrl, existingOgImageUrl = '', compact = false }) {
      const [imageError, setImageError] = useState(null);
      const [imgDragging, setImgDragging] = useState(false);
      const imgInputRef = useRef(null);

      const updateField = useCallback((patch) => {
        onChange(prev => ({ ...prev, ...patch }));
      }, [onChange]);

      // 自動產生 1200×630 Canvas 預覽圖
      useEffect(() => {
        if (value.ogImageMode !== 'auto') return;
        const canvas = document.createElement('canvas');
        const dataUrl = renderAutoOgCanvas(canvas, {
          title: value.title,
          description: value.description,
          badgeText: value.badgeText,
          targetUrl: value.targetUrl,
          themeKey: value.themeKey,
        });
        if (dataUrl !== value.autoDataUrl) {
          onChange(prev => ({ ...prev, autoDataUrl: dataUrl }));
        }
      }, [value.ogImageMode, value.title, value.description, value.badgeText, value.targetUrl, value.themeKey]);

      // 當上傳模式切換裁切／留白方式時重新渲染
      useEffect(() => {
        if (value.ogImageMode !== 'upload' || !value.uploadedRawDataUrl) return;
        let cancelled = false;
        renderUploadedOgFromDataUrl(value.uploadedRawDataUrl, value.imageFit)
          .then(dataUrl => {
            if (!cancelled) {
              setImageError(null);
              onChange(prev => ({ ...prev, uploadedDataUrl: dataUrl }));
            }
          })
          .catch(err => {
            if (!cancelled) setImageError(err.message);
          });
        return () => { cancelled = true; };
      }, [value.ogImageMode, value.uploadedRawDataUrl, value.imageFit]);

      const handleImageFile = async (file) => {
        try {
          setImageError(null);
          const raw = await readImageFileAsDataUrl(file);
          const processed = await renderUploadedOgFromDataUrl(raw, value.imageFit);
          updateField({ uploadedRawDataUrl: raw, uploadedDataUrl: processed });
        } catch (err) {
          setImageError(err.message);
        }
      };

      const handlePasteImage = (e) => {
        if (value.ogImageMode !== 'upload') return;
        const items = e.clipboardData?.items;
        if (!items) return;
        for (const item of items) {
          if (item.type && item.type.startsWith('image/')) {
            e.preventDefault();
            const file = item.getAsFile();
            if (file) handleImageFile(file);
            break;
          }
        }
      };

      const isGasUrl = /script\.google\.com/i.test(value.targetUrl || '');
      const urlLooksInvalid = Boolean((value.targetUrl || '').trim()) && !isValidHttpUrl(value.targetUrl);
      const workerDomain = getDomainLabel(workerUrl, 'htmlShare');

      const previewImageSrc = useMemo(() => {
        if (value.ogImageMode === 'auto') return value.autoDataUrl;
        if (value.ogImageMode === 'upload') return value.uploadedDataUrl || existingOgImageUrl || '';
        if (value.ogImageMode === 'url') return isValidHttpUrl(value.externalImageUrl) ? value.externalImageUrl.trim() : '';
        return '';
      }, [value.ogImageMode, value.autoDataUrl, value.uploadedDataUrl, value.externalImageUrl, existingOgImageUrl]);

      return (
        <div className="space-y-4" onPaste={handlePasteImage}>
          {/* 目標網址 */}
          <div>
            <label className="text-sm text-slate-300 font-medium block mb-1">
              目標長網址 <span className="text-cyan-400">*</span>
            </label>
            <input
              type="url"
              value={value.targetUrl}
              onChange={e => updateField({ targetUrl: e.target.value })}
              placeholder="https://script.google.com/a/macros/.../exec"
              className={`w-full bg-slate-800/60 border text-slate-100 text-sm rounded-xl block p-2.5 outline-none font-mono ${
                urlLooksInvalid ? 'border-amber-500/70 focus:ring-2 focus:ring-amber-500' : 'border-slate-700 focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500'
              }`}
            />
            {urlLooksInvalid ? (
              <p className="text-xs text-amber-400 mt-1">請輸入完整網址（需以 https:// 或 http:// 開頭）</p>
            ) : (
              <p className="text-xs text-slate-500 mt-1">
                支援 Google Apps Script、Google 表單、Notion 等任意網址；日後目標網址變更時，可在下方紀錄原地更新，短網址不變。
              </p>
            )}
          </div>

          {/* 標題與介紹文字 */}
          <div className="grid grid-cols-1 gap-3">

              <label className="text-sm text-slate-300 font-medium block mb-1">
                分享標題 <span className="text-xs text-slate-500 font-normal">（會顯示在 LINE / FB 預覽標題與預覽圖中）</span>
              </label>
              <input
                type="text"
                value={value.title}
                onChange={e => updateField({ title: e.target.value })}

              />

            <div>
              <label className="text-sm text-slate-300 font-medium block mb-1">
                介紹文字 <span className="text-xs text-slate-500 font-normal">（選填，建議 15～60 字）</span>

              <textarea
                value={value.description}

          window.QRCode.toCanvas(canvasRef.current, text, { width: 168, margin: 1, color: { dark: '#0f172a', light: '#f0fdfa' } }, () => {});
        }
      }, [text]);
      return <canvas ref={canvasRef} className="rounded-xl" />;
    }

    function ResultPanel({ result, onReset }) {

      const previewImg = result.ogImageUrl || result.shareMeta?.ogImageUrl || result.localPreviewDataUrl || '';

      const copyUrl = async () => {
        try {
          await navigator.clipboard.writeText(displayUrl);
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
        } catch {
          // 部分瀏覽器 clipboard API 需要 https / 使用者互動，失敗就靜默略過

                <div className="w-[184px] rounded-xl overflow-hidden border border-slate-700/80">

                </div>

            <div className="flex-1 min-w-0">

                    type="button"
                    onClick={() => setUseLineExtUrl(true)}

                      useLineExtUrl ? 'bg-cyan-600 text-white' : 'glass-card text-slate-300'

              <p className="text-sm text-slate-400 mb-1">分享網址</p>
              <div className="flex gap-2 mb-4">

                />

    // ── Upload form ──────────────────────────────────────────────────────
    function UploadForm({ workerUrl, onUploaded, onNeedSettings }) {
      const [mode, setMode] = useState('redirect'); // 'redirect' | 'file' | 'paste'
      const [fileName, setFileName] = useState('');
      const [htmlContent, setHtmlContent] = useState('');
      const [title, setTitle] = useState('');
      const [dragging, setDragging] = useState(false);
      const [redirectState, setRedirectState] = useState(() => createInitialRedirectState());
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const fileInputRef = useRef(null);

      const extractTitle = (html) => {
        const m = html.match(/<title>(.*?)<\/title>/is);
        return m && m[1] ? m[1].trim() : '';
      };

      const readFile = useCallback((file) => {
        if (!file) return;
        if (!/\.(html?|htm)$/i.test(file.name) && file.type !== 'text/html') {
          setError('請選擇 .html 檔案');
          return;
        }
        if (file.size > MAX_BYTES) {
          setError(`檔案過大（${formatSize(file.size)}），上限為 ${formatSize(MAX_BYTES)}`);
          return;
        }
        setError(null);
        setFileName(file.name);
        const reader = new FileReader();
        reader.onload = (e) => {
          const content = e.target.result;
          setHtmlContent(content);
          if (!title) {
            const extracted = extractTitle(content);
            setTitle(extracted || file.name.replace(/\.(html?|htm)$/i, ''));
          }
        };
        reader.readAsText(file);
      }, [title]);

      const handleUpload = async () => {
        if (!workerUrl) { onNeedSettings(); return; }

        let payload;
        try {
          if (mode === 'redirect') {
            payload = buildRedirectSubmission(redirectState);
          } else {
            if (!htmlContent.trim()) {
              setError('請先選擇檔案或貼上 HTML 內容');
              return;
            }
            payload = { html: htmlContent, title: title || fileName || '未命名分享' };
          }
        } catch (validationErr) {
          setError(validationErr.message);
          return;
        }

        setLoading(true);
        setError(null);
        try {
          const res = await fetch(`${workerUrl}/api/upload`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || `上傳失敗（HTTP ${res.status}）`);
          if (!data.shareMeta && payload.shareMeta) {
            data.shareMeta = payload.shareMeta;
          }
          if (typeof payload.ogImage === 'string' && payload.ogImage) {
            data.localPreviewDataUrl = payload.ogImage;
          }
          onUploaded(data);
        } catch (err) {
          setError(err.message === 'Failed to fetch'
            ? '無法連上後端，請確認 Worker 網址是否正確、已成功部署'
            : err.message);
        } finally {
          setLoading(false);
        }
      };

      const canSubmit = mode === 'redirect'
        ? Boolean((redirectState.targetUrl || '').trim())
        : Boolean(htmlContent.trim());

      return (
        <div className="glass-panel rounded-2xl p-6 fade-in">
          <div className="flex flex-wrap gap-2 mb-5">
            <button
              type="button"
              onClick={() => { setMode('redirect'); setError(null); }}
              className={`px-4 py-2 rounded-xl text-sm font-semibold transition-colors flex items-center gap-1.5 ${mode === 'redirect' ? 'bg-cyan-600' : 'glass-card text-slate-300'}`}
            >
              <IconLink className="w-4 h-4" /> 網址轉頁（短網址＋預覽）
            </button>
            <button
              type="button"
              onClick={() => { setMode('file'); setError(null); }}
              className={`px-4 py-2 rounded-xl text-sm font-semibold transition-colors ${mode === 'file' ? 'bg-cyan-600' : 'glass-card text-slate-300'}`}
            >
              選擇 HTML 檔案
            </button>
            <button
              type="button"
              onClick={() => { setMode('paste'); setError(null); }}
              className={`px-4 py-2 rounded-xl text-sm font-semibold transition-colors ${mode === 'paste' ? 'bg-cyan-600' : 'glass-card text-slate-300'}`}
            >
              貼上原始碼
            </button>
          </div>

          {mode === 'redirect' ? (
            <RedirectEditor
              value={redirectState}
              onChange={setRedirectState}
              workerUrl={workerUrl}
            />
          ) : (
            <>
              {mode === 'file' ? (
                <div
                  className={`drop-zone rounded-2xl p-8 text-center cursor-pointer ${dragging ? 'dragging' : ''}`}
                  onClick={() => fileInputRef.current?.click()}
                  onDragOver={e => { e.preventDefault(); setDragging(true); }}
                  onDragLeave={() => setDragging(false)}
                  onDrop={e => {
                    e.preventDefault();
                    setDragging(false);
                    readFile(e.dataTransfer.files?.[0]);
                  }}
                >
                  <IconUpload className="w-10 h-10 mx-auto mb-3 text-slate-400" />
                  {fileName ? (
                    <p className="text-slate-200 font-medium flex items-center justify-center gap-2">
                      <IconFileText className="w-4 h-4" /> {fileName}
                    </p>
                  ) : (
                    <>
                      <p className="text-slate-300 mb-1">拖放 .html 檔案到這裡，或點擊選擇</p>
                      <p className="text-xs text-slate-500">單檔上限 {formatSize(MAX_BYTES)}</p>
                    </>
                  )}
                  <input
                    ref={fileInputRef}
                    type="file"
                    accept=".html,.htm,text/html"
                    className="hidden"
                    onChange={e => readFile(e.target.files?.[0])}
                  />
                </div>
              ) : (
                <textarea
                  value={htmlContent}
                  onChange={e => setHtmlContent(e.target.value)}
                  placeholder="貼上完整的 HTML 原始碼（<!DOCTYPE html> ... </html>）"
                  rows={10}
                  className="w-full bg-slate-800/50 border border-slate-700 text-slate-200 text-sm rounded-xl focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 block p-3 outline-none font-mono resize-y"
                />
              )}

              <div className="mt-4">
                <label className="text-sm text-slate-400 block mb-1">標題（選填，會顯示在分享頁與紀錄裡）</label>
                <input
                  type="text"
                  value={title}
                  onChange={e => setTitle(e.target.value)}
                  placeholder="例如：AI 產生的計算機小工具"
                  className="w-full bg-slate-800/50 border border-slate-700 text-slate-200 text-sm rounded-xl focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 block p-2.5 outline-none"
                />
              </div>
            </>
          )}

          {error && (
            <div className="mt-4 rounded-xl border border-red-500/30 bg-red-900/10 p-3 text-sm text-red-300">
              {error}
            </div>
          )}

          <button
            onClick={handleUpload}
            disabled={loading || !canSubmit}
            className="mt-5 w-full py-3 rounded-xl font-semibold bg-cyan-600 hover:bg-cyan-500 disabled:opacity-40 disabled:cursor-not-allowed transition-colors flex items-center justify-center gap-2"
          >
            {loading ? (
              <>
                <div className="animate-spin rounded-full h-4 w-4 border-t-2 border-b-2 border-white"></div>
                建立中…
              </>
            ) : mode === 'redirect' ? (
              <>
                <IconLink className="w-4 h-4" /> 產生轉頁分享連結
              </>
            ) : (
              <>
                <IconUpload className="w-4 h-4" /> 上傳並取得分享網址
              </>
            )}
          </button>
        </div>
      );
    }

    // ── Update modal（把上傳紀錄裡的某一筆換成新版本，網址不變）─────────────
    function UpdateModal({ item, workerUrl, onClose, onUpdated }) {
      const initialIsRedirect = item.shareMeta?.type === 'redirect';
      const [mode, setMode] = useState(initialIsRedirect ? 'redirect' : 'file');
      const [fileName, setFileName] = useState('');
      const [htmlContent, setHtmlContent] = useState('');
      const [title, setTitle] = useState(item.title || '');
      const [dragging, setDragging] = useState(false);
      const [redirectState, setRedirectState] = useState(() => createInitialRedirectState(item));
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const fileInputRef = useRef(null);

      const handleFile = (file) => {
        readHtmlFile(file)
          .then(content => { setError(null); setFileName(file.name); setHtmlContent(content); })
          .catch(err => setError(err.message));
      };

      const handleUpdate = async () => {
        let payload;
        try {
          if (mode === 'redirect') {
            const built = buildRedirectSubmission(redirectState, {
              existingOgImageUrl: item.ogImageUrl || '',
            });
            payload = { ...built, editToken: item.editToken };
          } else {
            if (!htmlContent.trim()) {
              setError('請先選擇新的檔案，或貼上新的 HTML 內容');
              return;
            }
            payload = {
              html: htmlContent,
              title: title || item.title,
              editToken: item.editToken,
              ogImage: null,
            };
          }
        } catch (validationErr) {
          setError(validationErr.message);
          return;
        }

        setLoading(true);
        setError(null);
        try {
          const res = await fetch(`${workerUrl}/api/upload/${item.id}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || `更新失敗（HTTP ${res.status}）`);
          if (!data.shareMeta && payload.shareMeta) {
            data.shareMeta = payload.shareMeta;
          }
          onUpdated(data);
        } catch (err) {
          setError(err.message === 'Failed to fetch'
            ? '無法連上後端，請確認網路連線'
            : err.message);
        } finally {
          setLoading(false);
        }
      };

      const canUpdate = mode === 'redirect'
        ? Boolean((redirectState.targetUrl || '').trim())
        : Boolean(htmlContent.trim());

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 px-4 py-6 overflow-y-auto" onClick={onClose}>
          <div className="glass-panel rounded-2xl p-6 max-w-2xl w-full fade-in my-auto max-h-[90vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
            <h2 className="text-xl font-bold mb-1">更新版本</h2>
            <p className="text-sm text-slate-400 mb-4 truncate">
              網址不會改變：<span className="font-mono text-cyan-300">{item.url}</span>
            </p>

            <div className="flex flex-wrap gap-2 mb-4">
              <button
                type="button"
                onClick={() => { setMode('redirect'); setError(null); }}
                className={`px-3 py-1.5 rounded-lg text-sm font-semibold transition-colors flex items-center gap-1 ${mode === 'redirect' ? 'bg-cyan-600' : 'glass-card text-slate-300'}`}
              >
                <IconLink className="w-3.5 h-3.5" /> 網址轉頁
              </button>
              <button
                type="button"
                onClick={() => { setMode('file'); setError(null); }}
                className={`px-3 py-1.5 rounded-lg text-sm font-semibold transition-colors ${mode === 'file' ? 'bg-cyan-600' : 'glass-card text-slate-300'}`}
              >
                選擇檔案
              </button>
              <button
                type="button"
                onClick={() => { setMode('paste'); setError(null); }}
                className={`px-3 py-1.5 rounded-lg text-sm font-semibold transition-colors ${mode === 'paste' ? 'bg-cyan-600' : 'glass-card text-slate-300'}`}
              >
                貼上原始碼
              </button>
            </div>

            {mode === 'redirect' ? (
              <RedirectEditor
                value={redirectState}
                onChange={setRedirectState}
                workerUrl={workerUrl}
                existingOgImageUrl={item.ogImageUrl || ''}
                compact
              />
            ) : (
              <>
                {mode === 'file' ? (
                  <div
                    className={`drop-zone rounded-xl p-6 text-center cursor-pointer ${dragging ? 'dragging' : ''}`}
                    onClick={() => fileInputRef.current?.click()}
                    onDragOver={e => { e.preventDefault(); setDragging(true); }}
                    onDragLeave={() => setDragging(false)}
                    onDrop={e => { e.preventDefault(); setDragging(false); handleFile(e.dataTransfer.files?.[0]); }}
                  >
                    <IconUpload className="w-8 h-8 mx-auto mb-2 text-slate-400" />
                    {fileName ? (
                      <p className="text-slate-200 text-sm font-medium flex items-center justify-center gap-2">
                        <IconFileText className="w-4 h-4" /> {fileName}
                      </p>
                    ) : (
                      <p className="text-slate-300 text-sm">拖放新版的 .html 檔案到這裡，或點擊選擇</p>
                    )}
                    <input
                      ref={fileInputRef}
                      type="file"
                      accept=".html,.htm,text/html"
                      className="hidden"
                      onChange={e => handleFile(e.target.files?.[0])}
                    />
                  </div>
                ) : (
                  <textarea
                    value={htmlContent}
                    onChange={e => setHtmlContent(e.target.value)}
                    placeholder="貼上新版的完整 HTML 原始碼"
                    rows={8}
                    className="w-full bg-slate-800/50 border border-slate-700 text-slate-200 text-sm rounded-xl focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 block p-3 outline-none font-mono resize-y"
                  />
                )}

                <div className="mt-4">
                  <label className="text-sm text-slate-400 block mb-1">標題（選填）</label>
                  <input
                    type="text"
                    value={title}
                    onChange={e => setTitle(e.target.value)}
                    className="w-full bg-slate-800/50 border border-slate-700 text-slate-200 text-sm rounded-xl focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 block p-2.5 outline-none"
                  />
                </div>
              </>
            )}

            {error && (
              <div className="mt-4 rounded-xl border border-red-500/30 bg-red-900/10 p-3 text-sm text-red-300">
                {error}
              </div>
            )}

            <div className="flex gap-3 justify-end mt-5">
              <button
                onClick={onClose}
                className="px-4 py-2 rounded-xl text-sm text-slate-300 hover:bg-slate-700/50 transition-colors"
              >
                取消
              </button>
              <button
                onClick={handleUpdate}
                disabled={loading || !canUpdate}
                className="px-4 py-2 rounded-xl text-sm font-semibold bg-cyan-600 hover:bg-cyan-500 disabled:opacity-40 disabled:cursor-not-allowed transition-colors flex items-center gap-2"
              >
                {loading ? (
                  <>
                    <div className="animate-spin rounded-full h-4 w-4 border-t-2 border-b-2 border-white"></div>
                    更新中…
                  </>
                ) : (
                  <>
                    <IconRefresh className="w-4 h-4" /> 更新這個分享
                  </>
                )}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ── History ──────────────────────────────────────────────────────────
    function HistoryList({ history, onRemove, onRequestUpdate, justUpdatedId }) {
      if (history.length === 0) return null;
      return (
        <div className="mt-8 fade-in">
          <h2 className="text-sm font-semibold text-slate-400 mb-3">本機上傳紀錄（僅存在這個裝置的瀏覽器）</h2>
          <div className="space-y-2">
            {history.map(item => {
              const isRedirect = item.shareMeta?.type === 'redirect';
              return (
                <div key={item.id} className={`glass-card rounded-xl p-3 flex items-center gap-3 transition-colors ${justUpdatedId === item.id ? 'border-emerald-500/50' : ''}`}>
                  <div className="flex-1 min-w-0">
                    <div className="flex items-center gap-2">
                      {isRedirect && (
                        <span className="flex-shrink-0 text-[10px] font-semibold px-1.5 py-0.5 rounded bg-cyan-500/20 text-cyan-300 border border-cyan-500/30">
                          轉頁
                        </span>
                      )}
                      <p className="text-sm font-medium truncate">{item.title}</p>
                    </div>
                    <p className="text-xs text-slate-500 font-mono truncate">{item.url}</p>
                    {isRedirect && item.shareMeta?.targetUrl && (
                      <p className="text-[11px] text-slate-400 font-mono truncate">↳ {item.shareMeta.targetUrl}</p>
                    )}
                    <p className="text-xs text-slate-600">
                      {item.updatedAt ? (
                        <>建立於 {formatDate(item.uploadedAt)} · 更新於 {formatDate(item.updatedAt)}</>
                      ) : (
                        formatDate(item.uploadedAt)
                      )} · {formatSize(item.size)}
                    </p>
                    {justUpdatedId === item.id && (
                      <p className="text-xs text-emerald-400 mt-0.5 flex items-center gap-1"><IconCheck className="w-3 h-3" /> 已更新為新版本</p>
                    )}
                  </div>
                  {item.editToken && (
                    <button
                      title="更新版本（換掉內容或轉導網址，短網址不變）"
                      onClick={() => onRequestUpdate(item)}
                      className="p-2 rounded-lg hover:bg-slate-700/50 text-cyan-300 transition-colors"
                    >
                      <IconRefresh className="w-4 h-4" />
                    </button>
                  )}
                  <a
                    href={item.url}
                    target="_blank"
                    rel="noopener noreferrer"
                    title="開啟"
                    className="p-2 rounded-lg hover:bg-slate-700/50 text-slate-300 transition-colors"
                  >
                    <IconExternalLink className="w-4 h-4" />
                  </a>
                  <button
                    title="複製連結"
                    onClick={() => {
                      const urlToCopy = isRedirect && item.shareMeta?.openExternalInLine
                        ? withLineExternalParam(item.url)
                        : item.url;
                      navigator.clipboard?.writeText(urlToCopy).catch(() => {});
                    }}
                    className="p-2 rounded-lg hover:bg-slate-700/50 text-slate-300 transition-colors"
                  >
                    <IconCopy className="w-4 h-4" />
                  </button>
                  <button
                    title="從紀錄移除（不會刪除伺服器上的檔案）"
                    onClick={() => onRemove(item.id)}
                    className="p-2 rounded-lg hover:bg-slate-700/50 text-red-400 transition-colors"
                  >
                    <IconTrash className="w-4 h-4" />
                  </button>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ── App ──────────────────────────────────────────────────────────────
    function App() {
      const [workerUrl, setWorkerUrl] = useState(() => localStorage.getItem(STORAGE_WORKER_URL) || DEFAULT_WORKER_URL);
      const [showSettings, setShowSettings] = useState(false);
      const [result, setResult] = useState(null);
      const [history, setHistory] = useState(loadHistory);
      const [updatingItem, setUpdatingItem] = useState(null);
      const [justUpdatedId, setJustUpdatedId] = useState(null);

      const handleSaveWorkerUrl = (url) => {
        setWorkerUrl(url);
        try { localStorage.setItem(STORAGE_WORKER_URL, url); } catch {}
      };

      const handleUploaded = (data) => {
        setResult(data);
        const entry = {
          id: data.id,
          url: data.url,
          title: data.title,
          size: data.size,
          uploadedAt: data.uploadedAt,
          editToken: data.editToken,
          ...(data.ogImageUrl ? { ogImageUrl: data.ogImageUrl } : {}),
          ...(data.shareMeta ? { shareMeta: data.shareMeta } : {}),
        };
        const next = [entry, ...history.filter(h => h.id !== data.id)];
        setHistory(next);
        saveHistory(next);
      };

      const handleRemoveHistory = (id) => {
        const next = history.filter(h => h.id !== id);
        setHistory(next);
        saveHistory(next);
      };

      const handleUpdated = (data) => {
        const next = history.map(h => h.id === data.id
          ? {
              ...h,
              title: data.title,
              size: data.size,
              uploadedAt: data.uploadedAt,
              updatedAt: data.updatedAt,
              editToken: data.editToken || h.editToken,
              ogImageUrl: data.ogImageUrl || undefined,
              shareMeta: data.shareMeta || undefined,
            }
          : h);
        setHistory(next);
        saveHistory(next);
        setUpdatingItem(null);
        setJustUpdatedId(data.id);
        setTimeout(() => setJustUpdatedId(id => (id === data.id ? null : id)), 4000);
      };

      return (
        <div className="container mx-auto px-4 py-8 max-w-3xl">
          <header className="mb-8 fade-in flex items-start justify-between gap-4">
            <div>
              <h1 className="text-3xl md:text-4xl font-extrabold tracking-tight mb-2">
                <span className="bg-gradient-text">htmlShare</span>
              </h1>
              <p className="text-slate-400 text-sm max-w-lg">
                上傳單一 HTML 檔案，或把長網址（例如 Google Apps Script）包裝成附帶預覽圖與介紹文字的短網址。
              </p>
            </div>
            <button
              onClick={() => setShowSettings(true)}
              title="後端網址設定"
              className="p-2.5 rounded-xl glass-card hover:border-cyan-500/40 transition-colors flex-shrink-0"
            >
              <IconSettings className="w-5 h-5 text-slate-300" />
            </button>
          </header>

          {result ? (
            <ResultPanel result={result} onReset={() => setResult(null)} />
          ) : (
            <UploadForm
              workerUrl={workerUrl}
              onUploaded={handleUploaded}
              onNeedSettings={() => setShowSettings(true)}
            />
          )}

          <HistoryList
            history={history}
            onRemove={handleRemoveHistory}
            onRequestUpdate={setUpdatingItem}
            justUpdatedId={justUpdatedId}
          />

          {updatingItem && (
            <UpdateModal
              item={updatingItem}
              workerUrl={workerUrl}
              onClose={() => setUpdatingItem(null)}
              onUpdated={handleUpdated}
            />
          )}

          {showSettings && (
            <SettingsPanel
              workerUrl={workerUrl}
              onSave={handleSaveWorkerUrl}
              onClose={() => setShowSettings(false)}
            />
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(registration => {
            console.log('SW registered: ', registration);
          })
          .catch(registrationError => {
            console.log('SW registration failed: ', registrationError);
          });
      });
    }
  </script>
</body>
</html>
