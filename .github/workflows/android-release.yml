name: Build & Release PureReader Android APK

on:
  push:
    branches: ["main"]
    paths:
      - "pureReader/index.html"
      - "pureReader/extractor.js"
      - "pureReader/manifest.webmanifest"
      - "pureReader/icons/**"
      - "pureReader-android/**"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:
    inputs:
      version_name:
        description: "Optional versionName override (e.g. 1.2.0)"
        required: false

permissions:
  contents: write

concurrency:
  group: "purereader-android-release"
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Decode personal signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "Missing ANDROID_KEYSTORE_BASE64 secret" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "${{ runner.temp }}/release.jks"
          chmod 600 "${{ runner.temp }}/release.jks"

      - name: Run unit tests & build signed APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))
          VERSION_NAME="${INPUT_VERSION_NAME:-1.1.${GITHUB_RUN_NUMBER}}"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          cd pureReader-android
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease \
            -PpurereaderVersionCode="$VERSION_CODE" \
            -PpurereaderVersionName="$VERSION_NAME"

      - name: Prepare release artifacts (APK + version.json)
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p release-dist
          cp pureReader-android/app/build/outputs/apk/release/app-release.apk release-dist/PureReader-latest.apk
          SHA256=$(sha256sum release-dist/PureReader-latest.apk | awk '{print $1}')
          SHA256="$SHA256" node -e '
            const fs = require("fs");
            const data = {
              versionCode: Number(process.env.VERSION_CODE),
              versionName: process.env.VERSION_NAME,
              apkUrl: `https://github.com/${process.env.REPO}/releases/download/purereader-latest/PureReader-latest.apk`,
              sha256: process.env.SHA256,
              notes: (process.env.COMMIT_MSG || "PureReader Android auto build").split("\n")[0].slice(0, 200),
              updatedAt: new Date().toISOString()
            };
            fs.writeFileSync("release-dist/version.json", JSON.stringify(data, null, 2) + "\n");
          '

      - name: Publish rolling GitHub Release (purereader-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="PureReader Android v${VERSION_NAME} (Build ${VERSION_CODE})"
          NOTES=$(node -e 'const v = require("./release-dist/version.json"); console.log(`- Version: v${v.versionName} (Build ${v.versionCode})\n- SHA-256: \`${v.sha256}\`\n- Notes: ${v.notes}`);')
          if gh release view purereader-latest >/dev/null 2>&1; then
            gh release upload purereader-latest release-dist/PureReader-latest.apk release-dist/version.json --clobber
            gh release edit purereader-latest --title "$TITLE" --notes "$NOTES"
          else
            gh release create purereader-latest release-dist/PureReader-latest.apk release-dist/version.json \
              --title "$TITLE" \
              --notes "$NOTES"
          fi

      - name: Clean up temporary keystore
        if: always()
        run: rm -f "${{ runner.temp }}/release.jks"
