# Deploy static site to GitHub Pages using Actions
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Allow one concurrent deployment per branch; cancel in-progress runs for the same branch
concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.meta.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Generate appHub apps.json
        run: node scripts/generate-apps-index.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Set artifact name
        id: meta
        run: echo "name=github-pages-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: ${{ steps.meta.outputs.name }}
          path: '.'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
        run: |
          for i in $(seq 1 15); do
            COUNT=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
              --jq "[.artifacts[] | select(.name == \"$ARTIFACT_NAME\")] | length" 2>/dev/null || echo 0)
            echo "Attempt $i: found ${COUNT:-0} artifact(s) matching $ARTIFACT_NAME"
            if [[ "$COUNT" =~ ^[0-9]+$ ]] && [ "$COUNT" -ge 1 ]; then
              sleep 2
              exit 0
            fi
            sleep 2
          done
          echo "::warning::Artifact metadata did not appear within 30s; proceeding to deploy-pages anyway"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
