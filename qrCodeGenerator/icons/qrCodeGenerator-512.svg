<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="qrCodeGeneratorBg512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0f766e;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="102" ry="102" fill="url(#qrCodeGeneratorBg512)"/>

  <!-- QR finder squares (top-left, top-right, bottom-left) -->
  <g fill="#ffffff">
    <rect x="90" y="90" width="118" height="118" rx="16"/>
    <rect x="122" y="122" width="54" height="54" rx="8" fill="#0f766e"/>

    <rect x="304" y="90" width="118" height="118" rx="16"/>
    <rect x="336" y="122" width="54" height="54" rx="8" fill="#0f766e"/>

    <rect x="90" y="304" width="118" height="118" rx="16"/>
    <rect x="122" y="336" width="54" height="54" rx="8" fill="#0f766e"/>
  </g>

  <!-- Scattered modules bottom-right, suggesting QR data + scan target -->
  <g fill="#ffffff" opacity="0.95">
    <rect x="304" y="304" width="42" height="42" rx="8"/>
    <rect x="362" y="304" width="42" height="42" rx="8"/>
    <rect x="304" y="362" width="42" height="42" rx="8"/>
    <rect x="362" y="362" width="42" height="42" rx="8"/>
  </g>
</svg>
