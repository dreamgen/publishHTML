<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>網頁分享平台 - shareHTML</title>
  <meta name="description" content="快速發佈與預覽單一 HTML 的平台">
  
  <!-- PWA Setup -->
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./icons/shareHTML-192.svg">
  <link rel="apple-touch-icon" href="./icons/shareHTML-192.svg">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1e293b">

  <!-- React & Babel via CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    /* Custom CSS for Glassmorphism and Animations */
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      min-height: 100vh;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      overflow-x: hidden;
    }
    
    .glass-panel {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    
    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.3s ease;
    }
    
    .glass-card:hover {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }
    
    .bg-gradient-text {
      background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    /* Subtle background shapes */
    .bg-shape-1 {
      position: absolute;
      top: -100px;
      left: -100px;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(59,130,246,0.15) 0%, rgba(0,0,0,0) 70%);
      z-index: -1;
    }
    
    .bg-shape-2 {
      position: absolute;
      bottom: -150px;
      right: -100px;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(139,92,246,0.15) 0%, rgba(0,0,0,0) 70%);
      z-index: -1;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.5);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(71, 85, 105, 0.8);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(100, 116, 139, 1);
    }

    .fade-in {
      animation: fadeIn 0.5s ease-out forwards;
      opacity: 0;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="relative">

  <!-- Background Ornaments -->
  <div class="bg-shape-1 fixed pointer-events-none"></div>
  <div class="bg-shape-2 fixed pointer-events-none"></div>

  <div id="root"></div>

  <!-- Icons (Lucide-style SVG components) -->
  <script type="text/babel">
    const IconSearch = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    );
    const IconCalendar = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
    );
    const IconFile = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><polyline points="13 2 13 9 20 9"></polyline></svg>
    );
    const IconArrowRight = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
    );
    const IconExternalLink = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
    );

    const { useState, useEffect, useMemo } = React;

    function App() {
      const [files, setFiles] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      
      const [searchTerm, setSearchTerm] = useState('');
      const [sortBy, setSortBy] = useState('date'); // 'date' | 'name'
      const [filterType, setFilterType] = useState('all');

      useEffect(() => {
        fetch('./data.json')
          .then(res => {
            if (!res.ok) throw new Error('無法載入 data.json，請確認是否已執行建置腳本 (node build_data.js)');
            return res.json();
          })
          .then(data => {
            setFiles(data);
            setLoading(false);
          })
          .catch(err => {
            setError(err.message);
            setLoading(false);
          });
      }, []);

      const types = useMemo(() => {
        const uniqueTypes = new Set(files.map(f => f.type));
        return ['all', ...Array.from(uniqueTypes)];
      }, [files]);

      const filteredAndSortedFiles = useMemo(() => {
        let result = files;

        // Filter by type
        if (filterType !== 'all') {
          result = result.filter(f => f.type === filterType);
        }

        // Filter by search term
        if (searchTerm) {
          const lowerTerm = searchTerm.toLowerCase();
          result = result.filter(f => 
            f.title.toLowerCase().includes(lowerTerm) || 
            f.filename.toLowerCase().includes(lowerTerm)
          );
        }

        // Sort
        result.sort((a, b) => {
          if (sortBy === 'date') {
            return new Date(b.date) - new Date(a.date);
          } else if (sortBy === 'name') {
            return a.title.localeCompare(b.title);
          }
          return 0;
        });

        return result;
      }, [files, searchTerm, sortBy, filterType]);

      const formatDate = (dateStr) => {
        try {
          const d = new Date(dateStr);
          if (isNaN(d.getTime())) return dateStr;
          return d.toLocaleDateString('zh-TW', { year: 'numeric', month: '2-digit', day: '2-digit' });
        } catch {
          return dateStr;
        }
      };

      const formatSize = (bytes) => {
        if (!bytes) return '';
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
      };

      return (
        <div className="container mx-auto px-4 py-8 max-w-5xl">
          {/* Header */}
          <header className="mb-10 text-center fade-in">
            <h1 className="text-4xl md:text-5xl font-extrabold tracking-tight mb-3">
              <span className="bg-gradient-text">shareHTML</span> 平台
            </h1>
            <p className="text-slate-400 max-w-2xl mx-auto">
              快速瀏覽與分享獨立 HTML 檔案的專屬空間。
            </p>
          </header>

          {/* Controls */}
          <div className="glass-panel rounded-2xl p-4 mb-8 flex flex-col md:flex-row gap-4 items-center justify-between fade-in" style={{animationDelay: '0.1s'}}>
            
            <div className="relative w-full md:w-1/3">
              <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                <IconSearch />
              </div>
              <input 
                type="text" 
                placeholder="搜尋名稱或檔名..." 
                className="w-full bg-slate-800/50 border border-slate-700 text-slate-200 text-sm rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 block pl-10 p-2.5 outline-none transition-all"
                value={searchTerm}
                onChange={e => setSearchTerm(e.target.value)}
              />
            </div>

            <div className="flex w-full md:w-auto gap-4">
              <select 
                className="bg-slate-800/50 border border-slate-700 text-slate-200 text-sm rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 block p-2.5 outline-none flex-1 md:flex-none transition-all cursor-pointer"
                value={filterType}
                onChange={e => setFilterType(e.target.value)}
              >
                <option value="all">所有類型</option>
                {types.filter(t => t !== 'all').map(t => (
                  <option key={t} value={t}>{t}</option>
                ))}
              </select>

              <select 
                className="bg-slate-800/50 border border-slate-700 text-slate-200 text-sm rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 block p-2.5 outline-none flex-1 md:flex-none transition-all cursor-pointer"
                value={sortBy}
                onChange={e => setSortBy(e.target.value)}
              >
                <option value="date">最新上架</option>
                <option value="name">名稱排序</option>
              </select>
            </div>
          </div>

          {/* Content */}
          {loading ? (
            <div className="flex justify-center items-center h-48 fade-in">
              <div className="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-500"></div>
            </div>
          ) : error ? (
            <div className="glass-panel border-red-500/30 bg-red-900/10 rounded-2xl p-6 text-center fade-in">
              <p className="text-red-400 font-medium mb-2">無法載入資料</p>
              <p className="text-sm text-slate-400">{error}</p>
              <p className="text-sm text-slate-400 mt-4">請在終端機執行 <code>node build_data.js</code> 後重新整理。</p>
            </div>
          ) : (
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
              {filteredAndSortedFiles.length > 0 ? (
                filteredAndSortedFiles.map((file, idx) => (
                  <a 
                    href={`./${file.filename}`} 
                    target="_blank" 
                    rel="noopener noreferrer"
                    key={file.filename}
                    className="glass-card rounded-2xl p-5 flex flex-col group fade-in outline-none focus:ring-2 focus:ring-blue-500 block"
                    style={{ animationDelay: `${0.15 + idx * 0.05}s` }}
                  >
                    <div className="flex justify-between items-start mb-3">
                      <span className="inline-block px-2.5 py-1 bg-blue-500/20 text-blue-400 text-xs font-semibold rounded-full border border-blue-500/30">
                        {file.type}
                      </span>
                      <div className="text-slate-500 group-hover:text-blue-400 transition-colors">
                        <IconExternalLink />
                      </div>
                    </div>
                    
                    <h3 className="text-xl font-bold text-white mb-2 line-clamp-2 group-hover:text-blue-300 transition-colors">
                      {file.title}
                    </h3>
                    
                    <p className="text-sm text-slate-400 mb-4 font-mono truncate">
                      {file.filename}
                    </p>
                    
                    <div className="mt-auto pt-4 border-t border-slate-700/50 flex justify-between items-center text-xs text-slate-400">
                      <div className="flex items-center gap-1.5">
                        <IconCalendar />
                        {formatDate(file.date)}
                      </div>
                      <div className="flex items-center gap-1.5">
                        <IconFile />
                        {formatSize(file.size)}
                      </div>
                    </div>
                  </a>
                ))
              ) : (
                <div className="col-span-full glass-panel rounded-2xl p-12 text-center text-slate-400">
                  <p>找不到符合條件的檔案。</p>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(registration => {
            console.log('SW registered: ', registration);
          })
          .catch(registrationError => {
            console.log('SW registration failed: ', registrationError);
          });
      });
    }
  </script>
</body>
</html>
