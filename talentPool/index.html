<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>人才庫查詢</title>
<meta name="description" content="天達堂人才庫快速查詢：匯入人才庫總名冊 xlsx 後存在手機，可搜尋、多條件篩選人選，勾選後一鍵複製或分享到 LINE；資料不上傳">
<meta name="theme-color" content="#0f5e5a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="人才庫">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/talentPool-192.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/talentPool-192.png">
<style>
:root{
  --bg:#f3f6f5;--card:#fff;--ink:#1d2b2a;--muted:#5f716f;--line:#dbe4e2;
  --accent:#0f5e5a;--accent-2:#e7f2f0;--accent-ink:#fff;--warn:#a5620c;--warn-bg:#fdf1de;
  --sel:#e3f1ee;--chip:#eef3f2;--shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.05);
  --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111816;--card:#1a2321;--ink:#e3ecea;--muted:#9aaba8;--line:#2c3a37;
  --accent:#5cc2b6;--accent-2:#1d3532;--accent-ink:#0b1a18;--warn:#f0b35c;--warn-bg:#3a2c16;
  --sel:#1c3330;--chip:#24302e;--shadow:none;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "PingFang TC","Microsoft JhengHei","Noto Sans TC","Noto Sans CJK TC",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;min-height:100dvh}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.muted{color:var(--muted)}
.tiny{font-size:12px}.small{font-size:14px}

/* top */
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 8px;border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:8px}
.bar h1{font-size:18px;margin:0;flex:1;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:0;background:transparent;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--ink)}
.iconbtn:active{background:var(--chip)}
.iconbtn svg{width:22px;height:22px}
.searchrow{display:flex;gap:8px;margin-top:8px}
.search{flex:1;position:relative}
.search input{width:100%;height:42px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:0 36px 0 38px;outline:none}
.search input:focus{border-color:var(--accent)}
.search .ico{position:absolute;left:11px;top:11px;width:20px;height:20px;color:var(--muted)}
.search .clr{position:absolute;right:4px;top:4px;width:34px;height:34px;border:0;background:transparent;color:var(--muted);font-size:20px}
.fbtn{height:42px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:0 12px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.fbtn.on{border-color:var(--accent);color:var(--accent);font-weight:700}
.badge{background:var(--accent);color:var(--accent-ink);border-radius:999px;font-size:12px;min-width:20px;height:20px;padding:0 6px;display:inline-grid;place-items:center;font-weight:700}
.meta{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px;color:var(--muted)}
.meta .grow{flex:1;min-width:0}
.meta select{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 6px;font-size:14px}
.linkbtn{border:0;background:transparent;color:var(--accent);font-weight:600;font-size:14px;padding:4px 2px}
.activef{display:flex;gap:6px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
.activef::-webkit-scrollbar{display:none}
.activef button{flex:none;border:1px solid var(--accent);color:var(--accent);background:var(--accent-2);border-radius:999px;font-size:13px;padding:2px 10px}

/* list */
main{padding:10px 16px calc(110px + var(--safe-b))}
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--line);display:flex;margin-bottom:10px;overflow:hidden}
.card.sel{border-color:var(--accent);background:var(--sel)}
.ck{flex:none;width:48px;border:0;background:transparent;display:flex;align-items:flex-start;justify-content:center;padding-top:16px}
.ck span{width:24px;height:24px;border-radius:7px;border:2px solid var(--muted);display:grid;place-items:center}
.card.sel .ck span{background:var(--accent);border-color:var(--accent)}
.card.sel .ck span::after{content:"";width:6px;height:12px;border:solid var(--accent-ink);border-width:0 3px 3px 0;transform:translateY(-2px) rotate(45deg)}
.body{flex:1;min-width:0;padding:12px 12px 12px 0;border:0;background:transparent;text-align:left}
.nm{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.nm b{font-size:18px}
.tag{font-size:12px;border-radius:6px;padding:1px 6px;background:var(--chip);color:var(--muted);white-space:nowrap}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.acc{background:var(--accent-2);color:var(--accent)}
.l2{font-size:14px;color:var(--muted);margin-top:2px}
.l3{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.stats{display:flex;gap:12px;font-size:13px;margin-top:6px;color:var(--muted)}
.stats b{color:var(--ink);font-size:15px}
.empty{text-align:center;padding:48px 16px;color:var(--muted)}
.more{display:block;margin:4px auto 0;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 18px}

/* welcome */
.welcome{max-width:520px;margin:24px auto;background:var(--card);border-radius:16px;border:1px solid var(--line);padding:24px;box-shadow:var(--shadow)}
.welcome h2{margin:0 0 8px;color:var(--accent)}
.welcome ul{padding-left:20px;margin:8px 0 16px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.block{width:100%}
.btn:disabled{opacity:.5}

/* selection bar */
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + var(--safe-b));display:flex;gap:8px;align-items:center;box-shadow:0 -4px 16px rgba(0,0,0,.08)}
.selbar .cnt{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:4px 0}
.selbar .cnt b{color:var(--accent);font-size:18px}
.selbar .btn{padding:10px 12px;font-size:15px}
.line{background:#06c755!important;color:#fff!important}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:18px 18px 0 0;max-height:88dvh;display:flex;flex-direction:column;max-width:640px;margin:0 auto}
.sh-h{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sh-h h3{margin:0;font-size:17px;flex:1}
.sh-b{overflow:auto;padding:12px 16px;flex:1;overscroll-behavior:contain}
.sh-f{display:flex;gap:8px;padding:10px 16px calc(10px + var(--safe-b));border-top:1px solid var(--line)}
.sh-f .btn{flex:1}
.fs{margin-bottom:16px}
.fs h4{margin:0 0 6px;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px}
.fs h4 .sp{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:5px 12px;font-size:14px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.chip i{font-style:normal;opacity:.7;font-size:12px;margin-left:3px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;font-size:12px;padding:2px 8px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.rangerow{display:flex;align-items:center;gap:10px}
.rangerow input[type=range]{flex:1;accent-color:var(--accent)}
.rangerow output{min-width:56px;text-align:right;font-weight:700}
.agerow{display:flex;align-items:center;gap:8px}
.agerow input{width:84px;height:38px;border:1px solid var(--line);border-radius:8px;padding:0 8px;background:var(--bg)}
.yrsel{border:1px solid var(--line);border-radius:6px;background:var(--bg);font-size:13px;padding:1px 4px}

/* detail */
.kv{display:grid;grid-template-columns:88px 1fr;gap:4px 10px;font-size:15px;margin-bottom:12px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.yr{border-top:1px solid var(--line);padding:10px 0}
.yr h5{margin:0 0 6px;font-size:15px;color:var(--accent)}
.yr .row{font-size:14px;margin:2px 0}
.yr .row span{color:var(--muted)}
.note{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 10px;font-size:14px;margin-top:8px}

/* share sheet */
.fields{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fields label{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px}
.fields input{width:18px;height:18px;accent-color:var(--accent)}
.ta{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);font-size:14px;line-height:1.6;resize:vertical}
.inp{width:100%;height:40px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:var(--bg)}
.selitem{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.selitem .grow{flex:1;min-width:0}
.selitem button{border:0;background:var(--chip);border-radius:8px;width:34px;height:34px;font-size:18px;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);background:#1d2b2a;color:#fff;padding:10px 16px;border-radius:999px;z-index:60;font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,.25);max-width:90vw;text-align:center}
.menu{position:absolute;right:12px;top:calc(env(safe-area-inset-top,0px) + 52px);background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.15);z-index:50;min-width:200px;overflow:hidden}
.menu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:12px 16px;font-size:15px}
.menu button:active{background:var(--chip)}
.menu .info{padding:10px 16px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.menu .danger{color:#c0392b}
.loading{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.35);display:grid;place-items:center;color:#fff;font-weight:700}
</style>
</head>
<body>
<header class="top" id="top">
  <div class="bar">
    <h1>人才庫查詢</h1>
    <button class="iconbtn" id="btnMenu" aria-label="選單"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="5" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="12" cy="19" r="1.2"/></svg></button>
  </div>
  <div id="toolbar" class="hidden">
    <div class="searchrow">
      <div class="search">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="姓名、職務、班別…" autocomplete="off" enterkeyhint="search">
        <button class="clr hidden" id="qClear" aria-label="清除">×</button>
      </div>
      <button class="fbtn" id="btnFilter"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>篩選<span class="badge hidden" id="fCount">0</span></button>
    </div>
    <div class="activef" id="activeF"></div>
    <div class="meta">
      <span class="grow" id="resultInfo"></span>
      <select id="sort" aria-label="排序">
        <option value="att">2026 出席多→少</option>
        <option value="total">歷練紀錄多→少</option>
        <option value="span">服務年數多→少</option>
        <option value="ageAsc">年齡小→大</option>
        <option value="ageDesc">年齡大→小</option>
        <option value="name">姓名</option>
      </select>
      <button class="linkbtn" id="btnSelAll">全選結果</button>
    </div>
  </div>
</header>

<div class="menu hidden" id="menu">
  <div class="info" id="dataInfo">尚未匯入</div>
  <button id="mImport">匯入／更新人才庫 xlsx</button>
  <button id="mClearSel">清除已選人選</button>
  <button id="mWipe" class="danger">刪除本機資料</button>
</div>

<main id="main">
  <section class="welcome hidden" id="welcome">
    <h2>人才庫查詢</h2>
    <p class="small">匯入〈天達堂人才庫總名冊〉xlsx 一次，之後打開就能直接查。</p>
    <ul class="small">
      <li>搜尋姓名、編碼、歷年職務與班別</li>
      <li>依區域、乾坤、年齡、道職、推薦組別、出席次數…篩選</li>
      <li>勾選合適人選，一鍵複製或分享到 LINE</li>
      <li>資料只存在這支手機，不上傳任何伺服器</li>
    </ul>
    <button class="btn block" id="btnImport1">選擇人才庫 xlsx 檔</button>
    <p class="tiny muted" style="margin-top:12px">讀取工作表：〈確定的姓名（已登錄天達名冊）〉、〈姓名疑似可用（不在官方名冊中）〉。</p>
  </section>
  <div id="list"></div>
</main>

<div class="selbar hidden" id="selbar">
  <button class="cnt" id="btnSelList"><span class="tiny muted">已選</span> <b id="selN">0</b> <span class="tiny muted">人 ▸</span></button>
  <button class="btn ghost" id="btnCopy">複製</button>
  <button class="btn line" id="btnShare">分享 LINE</button>
</div>

<!-- filter sheet -->
<div class="scrim hidden" id="scrim"></div>
<section class="sheet hidden" id="sheetFilter" role="dialog" aria-label="篩選">
  <div class="sh-h"><h3>篩選條件</h3><button class="linkbtn" id="fReset">全部清除</button><button class="iconbtn" data-close aria-label="關閉">✕</button></div>
  <div class="sh-b" id="filterBody"></div>
  <div class="sh-f"><button class="btn block" data-close id="fApply">查看結果</button></div>
</section>

<!-- detail sheet -->
<section class="sheet hidden" id="sheetDetail" role="dialog" aria-label="人員資料">
  <div class="sh-h"><h3 id="dTitle"></h3><button class="iconbtn" data-close aria-label="關閉">✕</button></div>
  <div class="sh-b" id="dBody"></div>
  <div class="sh-f"><button class="btn ghost" id="dCopy">複製此人</button><button class="btn" id="dSel">加入已選</button></div>
</section>

<!-- share sheet -->
<section class="sheet hidden" id="sheetShare" role="dialog" aria-label="分享">
  <div class="sh-h"><h3>複製／分享已選人選</h3><button class="iconbtn" data-close aria-label="關閉">✕</button></div>
  <div class="sh-b">
    <div class="fs"><h4>標題（可留空）</h4><input class="inp" id="shTitle" placeholder="例：禮節組候選名單"></div>
    <div class="fs"><h4>包含欄位 <span class="sp"></span><span class="seg" id="shStyle"><button data-v="line">單行</button><button data-v="block">分行</button></span></h4><div class="fields" id="shFields"></div></div>
    <div class="fs"><h4>預覽（可直接修改）</h4><textarea class="ta" id="shText"></textarea></div>
  </div>
  <div class="sh-f"><button class="btn ghost" id="shCopy">複製</button><button class="btn ghost" id="shSys">其他分享…</button><button class="btn line" id="shLine">分享 LINE</button></div>
</section>

<!-- selected list sheet -->
<section class="sheet hidden" id="sheetSel" role="dialog" aria-label="已選人選">
  <div class="sh-h"><h3>已選人選</h3><button class="linkbtn" id="selClear">全部清除</button><button class="iconbtn" data-close aria-label="關閉">✕</button></div>
  <div class="sh-b" id="selBody"></div>
  <div class="sh-f"><button class="btn line" id="selShare">複製／分享…</button></div>
</section>

<input type="file" id="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" class="hidden">
<div class="loading hidden" id="loading">讀取中…</div>
<div class="toast hidden" id="toast"></div>
<script src="./app.js"></script>
</body>
</html>
