<script>
'use strict';
/* ════════════════════════════════════════════════════════════════════
 * 工作行程記錄 (workLog)
 * 資料僅存在本機 localStorage（key: workLog.v1），可匯出／匯入 JSON 備份。
 *
 * 資料結構：
 * {
 *   version: 1,
 *   settings: { name, mailTo, mailCc, subjectTpl, useGps, autoLeave, promptDist, autoDist },
 *   places:    [{ id, name, lat?, lng? }],           // 常用地點
 *   templates: [{ id, text }],                        // 常用工作內容
 *   days: {
 *     'YYYY-MM-DD': {
 *       todos:  [{ id, text, done }],                 // 本日待辦
 *       visits: [{ id, placeId, place, arriveAt, leaveAt|null, geo|null,
 *                  items: [{ id, text, todoId|null, result }], note,
 *                  // 自動離開偵測
 *                  lastSeenAt,            // 最後一次確認在打卡點附近的時間
 *                  leaveMode,             // 'manual' | 'auto' | 'prompt'（提示後確認）
 *                  leavePending,          // 離開時間待確認（App 未開啟期間離開，時間為推算）
 *                  leaveHints: { lastSeen, estimate } | null,
 *                  outSince, outCount, lastOutT, snoozeUntil }],
 *       summary: '',                                  // 今日總結
 *       tomorrow: ''                                  // 明日計畫（每行一項）
 *     }
 *   }
 * }
 * ════════════════════════════════════════════════════════════════════ */

const STORE_KEY = 'workLog.v1';
const APP_VERSION = '1.1.0';
const MAX_ACC = 150;               // 誤差大於此值的定位讀數直接忽略（公尺）
const TRAVEL_KMH = 25;             // 推算交通時間用的市區平均時速
const SNOOZE_MS = 30 * 60000;      // 「還沒離開」後暫停偵測時間
const PRECISE_GAP = 3 * 60000;     // 最後在場到偵測離開 ≤ 3 分：視為連續監測，取第一次超出範圍的時間
const TRUST_GAP = 15 * 60000;      // ≤ 15 分：直接採用最後在場時間；超過則需確認

// ─── 小工具 ───────────────────────────────────────────────────────────
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = (n) => String(n).padStart(2, '0');
const WD = '日一二三四五六';
const dayKey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseKey = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return dayKey(d); };
const hm = (ms) => { const d = new Date(ms); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const nowHM = () => hm(Date.now());
const dateLabel = (k) => { const d = parseKey(k); return `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())}（${WD[d.getDay()]}）`; };
const shortDate = (k) => { const d = parseKey(k); return `${d.getMonth() + 1}/${d.getDate()}（${WD[d.getDay()]}）`; };
const toMs = (k, t) => { const [h, m] = String(t || '00:00').split(':').map(Number); const d = parseKey(k); d.setHours(h || 0, m || 0, 0, 0); return d.getTime(); };
const fmtDur = (min) => {
    if (min == null || isNaN(min)) return '';
    const h = Math.floor(min / 60), m = min % 60;
    if (!h) return `${m} 分`;
    return m ? `${h} 小時 ${m} 分` : `${h} 小時`;
};
const hours2 = (min) => (Math.round(min / 60 * 100) / 100).toFixed(2);
const visitMin = (v) => Math.max(0, Math.round(((v.leaveAt ?? Date.now()) - v.arriveAt) / 60000));
const sortVisits = (vs) => vs.slice().sort((a, b) => a.arriveAt - b.arriveAt);
const splitLines = (s) => String(s || '').split(/\r?\n/).map((x) => x.replace(/^\s*(?:[-*・•●▪︎]|\d+[.、)])\s*/, '').trim()).filter(Boolean);

// ─── 資料存取 ─────────────────────────────────────────────────────────
function defaults() {
    return {
        version: 1,
        settings: { name: '', mailTo: '', mailCc: '', subjectTpl: '【工作日報】{date} {name}', useGps: true,
            autoLeave: true, promptDist: 300, autoDist: 1000 },
        places: [
            { id: uid(), name: '公司' },
            { id: uid(), name: '在家（遠端）' },
        ],
        templates: ['需求訪談／確認', '測試案例撰寫', '測試執行', '缺陷追蹤與回歸測試', '會議', '文件／報告整理', '團隊管理與指導']
            .map((text) => ({ id: uid(), text })),
        days: {},
    };
}
function normalize(d) {
    const def = defaults();
    return {
        version: 1,
        settings: { ...def.settings, ...(d && d.settings || {}) },
        places: Array.isArray(d && d.places) ? d.places : def.places,
        templates: Array.isArray(d && d.templates) ? d.templates : def.templates,
        days: (d && typeof d.days === 'object' && d.days) ? d.days : {},
    };
}
function load() {
    try {
        const raw = localStorage.getItem(STORE_KEY);
        if (raw) return normalize(JSON.parse(raw));
    } catch (e) { console.warn('[workLog] load failed', e); }
    return defaults();
}
let data = load();
let saveTimer = null;
let persistAsked = false;
function save(immediate) {
    clearTimeout(saveTimer);
    const run = () => {
        // 清掉完全空白的日期，避免資料膨脹
        for (const [k, d] of Object.entries(data.days)) {
            if (!d.todos.length && !d.visits.length && !d.summary && !d.tomorrow) delete data.days[k];
        }
        try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); }
        catch (e) { toast('儲存失敗：' + e.message); }
        if (!persistAsked && navigator.storage && navigator.storage.persist) {
            persistAsked = true;
            navigator.storage.persist().catch(() => {});
        }
    };
    if (immediate) run(); else saveTimer = setTimeout(run, 300);
}
window.addEventListener('pagehide', () => save(true));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') save(true); });

const EMPTY_DAY = () => ({ todos: [], visits: [], summary: '', tomorrow: '' });
function getDay(k) { return data.days[k] || EMPTY_DAY(); }
function ensureDay(k) {
    if (!data.days[k]) data.days[k] = EMPTY_DAY();
    const d = data.days[k];
    d.todos ||= []; d.visits ||= []; d.summary ??= ''; d.tomorrow ??= '';
    return d;
}
function findVisit(vid) {
    for (const [k, d] of Object.entries(data.days)) {
        const v = (d.visits || []).find((x) => x.id === vid);
        if (v) return { key: k, day: d, v };
    }
    return null;
}
function findOpenVisit() {
    let found = null;
    for (const [k, d] of Object.entries(data.days)) {
        for (const v of d.visits || []) if (!v.leaveAt && (!found || v.arriveAt > found.v.arriveAt)) found = { key: k, day: d, v };
    }
    return found;
}
function placeUsage() {
    const c = {};
    for (const d of Object.values(data.days)) for (const v of d.visits || []) c[v.placeId] = (c[v.placeId] || 0) + 1;
    return c;
}
function sortedPlaces() {
    const u = placeUsage();
    return data.places.map((p, i) => ({ p, i, n: u[p.id] || 0 })).sort((a, b) => b.n - a.n || a.i - b.i).map((x) => x.p);
}
function resolvePlace(name) {
    name = String(name || '').trim();
    if (!name) return null;
    let p = data.places.find((x) => x.name.toLowerCase() === name.toLowerCase());
    if (!p) { p = { id: uid(), name }; data.places.push(p); }
    return p;
}

// ─── GPS ───────────────────────────────────────────────────────────────
function distM(a, b) {
    const R = 6371000, rad = Math.PI / 180;
    const dLat = (b.lat - a.lat) * rad, dLng = (b.lng - a.lng) * rad;
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
}
function nearestPlace(geo) {
    if (!geo) return null;
    let best = null;
    for (const p of data.places) {
        if (typeof p.lat !== 'number') continue;
        const d = distM(geo, p);
        if (!best || d < best.dist) best = { place: p, dist: d };
    }
    return best;
}
function getPosition() {
    return new Promise((resolve, reject) => {
        if (!navigator.geolocation) return reject(new Error('此裝置不支援定位'));
        navigator.geolocation.getCurrentPosition(
            (p) => resolve({ lat: +p.coords.latitude.toFixed(6), lng: +p.coords.longitude.toFixed(6), acc: Math.round(p.coords.accuracy) }),
            (err) => reject(new Error(err.code === 1 ? '未授權定位' : err.code === 3 ? '定位逾時' : '定位失敗')),
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
        );
    });
}
function locate(force) {
    if (!data.settings.useGps) return;
    if (!force && (ui.geoBusy || (ui.geo && Date.now() - ui.geoAt < 120000))) return;
    ui.geoBusy = true; ui.geoErr = '';
    updateGeoLine();
    getPosition().then((g) => {
        ui.geo = g; ui.geoAt = Date.now(); ui.geoBusy = false;
        const n = nearestPlace(g);
        if (n && n.dist <= 300 && !ui.arrivePlace && !ui.arriveNew) ui.arrivePlace = n.place.id;
        if (ui.tab === 'today') render(); else updateGeoLine();
    }).catch((e) => {
        ui.geoBusy = false; ui.geoErr = e.message; updateGeoLine();
    });
}
function geoLineHtml() {
    if (!data.settings.useGps) return '';
    let txt;
    if (ui.geoBusy) txt = '<span class="text-slate-500">📍 定位中…</span>';
    else if (ui.geoErr) txt = `<span class="text-rose-600">📍 ${esc(ui.geoErr)}</span>`;
    else if (ui.geo) {
        const n = nearestPlace(ui.geo);
        txt = `<span class="text-emerald-700">📍 已定位（誤差約 ${ui.geo.acc} m）</span>` +
            (n ? `<span class="text-slate-500"> · 最近：${esc(n.place.name)}（${n.dist < 1000 ? Math.round(n.dist) + ' m' : (n.dist / 1000).toFixed(1) + ' km'}）</span>` : '');
    } else txt = '<span class="text-slate-500">📍 尚未定位</span>';
    return `${txt} <button class="ml-1 text-indigo-600 underline" data-act="relocate">重新定位</button>`;
}
function updateGeoLine() { const el = $('#geoLine'); if (el) el.innerHTML = geoLineHtml(); }

// ─── 自動離開偵測 ───────────────────────────────────────────────────────
// PWA 只有在前景時能讀取定位：App 開著時持續監測；App 重新開啟時立即補判一次。
// 規則：距打卡點 > 提示距離 → 提示是否離開；> 自動離開距離 → 自動結束打卡（可復原）。
//      需連續 2 次（間隔 ≥ 10 秒）或持續 2 分鐘在範圍外才成立；誤差 > 150 m 的讀數忽略；
//      以「距離 − 誤差」判斷是否確實在範圍外，避免 GPS 飄移誤判。
const mon = { watchId: null, timer: null, busy: false, retry: null };
const fromPos = (p) => ({ lat: p.coords.latitude, lng: p.coords.longitude, acc: Math.round(p.coords.accuracy), t: Math.min(p.timestamp || Date.now(), Date.now()) });
const fmtDist = (d) => d < 1000 ? `${Math.round(d)} m` : `${(d / 1000).toFixed(1)} km`;

function visitRef(v) {
    const p = data.places.find((x) => x.id === v.placeId);
    if (p && typeof p.lat === 'number') return { lat: p.lat, lng: p.lng };
    if (v.geo) return { lat: v.geo.lat, lng: v.geo.lng };
    return null;
}
function monitorTarget() {
    const s = data.settings;
    if (!s.useGps || !s.autoLeave || !navigator.geolocation) return null;
    const o = findOpenVisit();
    if (!o) return null;
    const ref = visitRef(o.v);
    return ref ? { ...o, ref } : null;
}
function syncMonitor() {
    const need = document.visibilityState === 'visible' && !!monitorTarget();
    if (need && mon.watchId == null) {
        mon.watchId = navigator.geolocation.watchPosition(
            (p) => onReading(fromPos(p)),
            () => {},
            { enableHighAccuracy: true, maximumAge: 15000, timeout: 30000 }
        );
        mon.timer = setInterval(pollOnce, 60000);
        pollOnce();
    } else if (!need && mon.watchId != null) {
        navigator.geolocation.clearWatch(mon.watchId);
        clearInterval(mon.timer); clearTimeout(mon.retry);
        mon.watchId = null; mon.timer = null;
    }
}
function pollOnce() {
    if (mon.busy || document.visibilityState !== 'visible' || !monitorTarget()) return;
    mon.busy = true;
    navigator.geolocation.getCurrentPosition(
        (p) => { mon.busy = false; onReading(fromPos(p)); },
        (e) => { mon.busy = false; ui.monNote = e.code === 1 ? '未授權定位，無法偵測離開' : '暫時無法取得定位'; updateMonLine(); },
        { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 }
    );
}

// 推算離開時間
function estimateLeave(v, now, distFromRef) {
    const lastSeen = Math.max(v.lastSeenAt || v.arriveAt, v.arriveAt);
    const outAt = v.outSince || now;
    const gap = outAt - lastSeen;
    if (gap <= PRECISE_GAP) return { at: Math.max(outAt, v.arriveAt), precise: true };
    if (gap <= TRUST_GAP) return { at: lastSeen, precise: true };
    const travel = distFromRef != null ? Math.round(distFromRef / 1000 / TRAVEL_KMH * 60) * 60000 : 0;
    const est = Math.min(now, Math.max(lastSeen, now - travel));
    return { at: est, precise: false, hints: { lastSeen, estimate: est } };
}
function resetOut(v) { v.outSince = null; v.outCount = 0; v.lastOutT = null; }
function applyLeave(v, est, mode) {
    v.leaveAt = Math.max(est.at, v.arriveAt);
    v.leaveMode = mode;
    v.leavePending = !est.precise;
    v.leaveHints = est.precise ? null : est.hints;
    resetOut(v);
}

function onReading(r) {
    const t = monitorTarget();
    if (!t) return;
    ui.geo = { lat: +r.lat.toFixed(6), lng: +r.lng.toFixed(6), acc: r.acc }; ui.geoAt = Date.now();
    if ($('#modal').innerHTML) return;                 // 使用者正在操作對話框時不打擾
    const v = t.v, s = data.settings;
    if (r.t < (v.lastSeenAt || 0)) return;             // 過期的快取讀數
    if (r.acc > MAX_ACC) { ui.monNote = `定位誤差過大（${r.acc} m），本次略過`; updateMonLine(); return; }
    const d = distM(r, t.ref);
    ui.monDist = d; ui.monNote = '';
    if (d <= s.promptDist) {                            // 仍在打卡點附近
        v.lastSeenAt = r.t; resetOut(v); save(); updateMonLine(); return;
    }
    if (d - r.acc <= s.promptDist) { updateMonLine(); return; }   // 誤差範圍內無法判斷
    if (v.snoozeUntil && Date.now() < v.snoozeUntil) { updateMonLine(); return; }
    if (!v.outSince) { v.outSince = r.t; v.outCount = 0; }
    if (!v.lastOutT || r.t - v.lastOutT >= 10000) { v.outCount = (v.outCount || 0) + 1; v.lastOutT = r.t; }
    save();
    const confirmed = v.outCount >= 2 || r.t - v.outSince >= 120000;
    if (!confirmed) {
        clearTimeout(mon.retry); mon.retry = setTimeout(pollOnce, 20000);   // 20 秒後再確認一次
        updateMonLine(); return;
    }
    const est = estimateLeave(v, r.t, d);
    if (d > s.autoDist) autoLeave(t, est, d);
    else promptLeave(t, est, d);
}

function autoLeave(t, est, d) {
    const v = t.v;
    applyLeave(v, est, 'auto');
    save(); render();
    try { navigator.vibrate && navigator.vibrate(200); } catch (e) {}
    snackbar(`已自動結束「${v.place}」（距離 ${fmtDist(d)}）${v.leavePending ? '，離開時間待確認' : `，離開 ${hm(v.leaveAt)}`}`, '復原', () => {
        const f = findVisit(v.id); if (!f) return;
        Object.assign(f.v, { leaveAt: null, leaveMode: null, leavePending: false, leaveHints: null, snoozeUntil: Date.now() + SNOOZE_MS });
        resetOut(f.v); save(); render(); toast('已復原，30 分鐘內不再自動偵測');
    });
}

function promptLeave(t, est, d) {
    const v = t.v;
    openModal(`
        <div id="leavePrompt" data-vid="${v.id}" data-key="${t.key}">
            <h2 class="font-bold text-lg mb-1">你似乎已離開「${esc(v.place)}」</h2>
            <p class="text-sm text-slate-600 mb-4">目前距打卡點約 ${fmtDist(d)}。要結束這次打卡嗎？</p>
            <div class="flex items-center gap-2 mb-2">
                <span class="label shrink-0">離開時間</span>
                <input type="time" class="field !w-auto" id="lpTime" value="${hm(est.at)}">
            </div>
            ${est.precise ? '' : `
            <p class="text-xs text-amber-700 mb-2">App 未開啟期間無法得知確切離開時間，請選擇或自行修改：</p>
            <div class="flex flex-wrap gap-2 mb-2">${leaveHintChips(est.hints, 'lp-set')}</div>`}
            <div class="flex gap-2 mt-5">
                <button class="btn btn-ghost flex-1" data-act="lp-stay">還沒離開</button>
                <button class="btn btn-primary flex-1" data-act="lp-leave">結束打卡</button>
            </div>
        </div>`);
    try { navigator.vibrate && navigator.vibrate([120, 80, 120]); } catch (e) {}
}
function leaveHintChips(h, act, vid) {
    if (!h) return '';
    const opts = [['最後在場', h.lastSeen]];
    if (h.estimate && Math.abs(h.estimate - h.lastSeen) >= 60000) opts.push(['推算', h.estimate]);
    return opts.map(([label, at]) => `<button class="chip" data-act="${act}" ${vid ? `data-vid="${vid}"` : ''} data-at="${at}">${label} ${hm(at)}</button>`).join('');
}
function pendingBlock(v) {
    if (!v.leavePending) return '';
    return `
        <div class="mt-2 rounded-lg bg-amber-50 border border-amber-300 p-2 text-xs text-amber-900">
            <div class="mb-1.5">⚠️ 離開時間待確認（目前記為推算的 ${hm(v.leaveAt)}；App 未開啟期間無法得知確切時間），點選採用：</div>
            <div class="flex flex-wrap gap-1.5">
                ${leaveHintChips(v.leaveHints, 'fix-leave', v.id)}
                ${v.leaveHints && [v.leaveHints.lastSeen, v.leaveHints.estimate].some((x) => x && hm(x) === hm(v.leaveAt)) ? '' : `<button class="chip" data-act="fix-leave" data-vid="${v.id}" data-at="${v.leaveAt}">✓ 就用 ${hm(v.leaveAt)}</button>`}
                <button class="chip" data-act="edit-visit" data-vid="${v.id}">自訂…</button>
            </div>
        </div>`;
}
function monLineHtml(v) {
    const s = data.settings;
    if (!s.useGps || !s.autoLeave) return '<span class="text-slate-400">自動離開偵測已關閉（可在設定開啟）</span>';
    if (!visitRef(v)) return '<span class="text-slate-400">📡 此行程沒有座標，無法自動偵測離開</span>';
    const parts = ['📡 自動離開偵測中'];
    if (ui.monDist != null) parts.push(`距打卡點 ${fmtDist(ui.monDist)}`);
    parts.push(`最後在場 ${hm(v.lastSeenAt || v.arriveAt)}`);
    if (v.snoozeUntil && Date.now() < v.snoozeUntil) parts.push(`暫停至 ${hm(v.snoozeUntil)}`);
    return `<span class="text-slate-500">${parts.join(' · ')}</span>${ui.monNote ? `<div class="text-amber-700">${esc(ui.monNote)}</div>` : ''}`;
}
function updateMonLine() {
    const el = $('#monLine'); if (!el) return;
    const f = findVisit(el.dataset.vid); if (f) el.innerHTML = monLineHtml(f.v);
}
function pendingVisits(k) { return getDay(k).visits.filter((v) => v.leavePending); }

// ─── Toast / Modal ─────────────────────────────────────────────────────
let toastTimer;
function toast(msg) {
    const t = $('#toast');
    $('#toastText').textContent = msg;
    t.style.opacity = '1'; t.style.transform = 'translate(-50%, 0)';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translate(-50%, 8px)'; }, 2200);
}
let snackTimer;
function snackbar(msg, btnText, onClick) {
    const el = $('#snackbar');
    $('#snackText').textContent = msg;
    const b = $('#snackBtn');
    b.textContent = btnText || '';
    b.onclick = () => { el.classList.add('hidden'); onClick && onClick(); };
    el.classList.remove('hidden');
    clearTimeout(snackTimer);
    snackTimer = setTimeout(() => el.classList.add('hidden'), 10000);
}
function openModal(html) {
    $('#modal').innerHTML = `
        <div class="fixed inset-0 z-40 bg-slate-900/40 flex items-end sm:items-center justify-center" data-act="modal-bg">
            <div class="bg-white w-full sm:max-w-lg rounded-t-2xl sm:rounded-2xl max-h-[90dvh] overflow-y-auto p-4 safe-bottom" data-modal-panel>${html}</div>
        </div>`;
}

function viewToday() {
    const k = ui.date, d = getDay(k), isToday = k === dayKey();
    const open = findOpenVisit();
    let html = '';

    if (open && open.key !== k) {
        html += `
        <div class="card !bg-amber-50 !border-amber-300 mb-4 flex items-center gap-3">
            <div class="flex-1 text-sm text-amber-900">⚠️ 尚未離開：<b>${esc(open.v.place)}</b>（${shortDate(open.key)} ${hm(open.v.arriveAt)} 抵達）</div>
            <button class="btn btn-primary !py-1.5 text-sm" data-act="goto-date" data-key="${open.key}">前往處理</button>
        </div>`;
    }

    if (open && open.key === k) {
        if (isToday && ui.arriveWhileOpen) html += arriveCard(open.v);
        html += openVisitCard(open.v, k);
    } else if (isToday && !open) html += arriveCard();

    html += todoSection(k, d);
    html += timelineSection(k, d);
    return html;
}

    return `
        ${todos.length ? `<div class="label mb-1">本日待辦</div>
        <div class="flex flex-wrap gap-2 mb-2">${todos.map((t) => `<button class="chip todo" data-act="add-item" data-vid="${v.id}" data-todo="${t.id}">＋ ${esc(t.text)}</button>`).join('')}</div>` : ''}
        ${data.templates.length ? `<div class="label mb-1">常用工作內容</div>
        <div class="flex flex-wrap gap-2 mb-2">${data.templates.map((t) => `<button class="chip tpl" data-act="add-item" data-vid="${v.id}" data-tpl="${t.id}">＋ ${esc(t.text)}</button>`).join('')}</div>` : ''}

function timelineSection(k, d) {
    const vs = sortVisits(d.visits);
    const total = vs.reduce((s, v) => s + visitMin(v), 0);
    let html = `
    <section class="mb-4">
        <div class="flex items-center gap-2 mb-2 px-1">
            <h2 class="font-bold text-lg">🗓️ 行程</h2>
            <span class="text-xs text-slate-500">${vs.length ? `駐點合計 ${fmtDur(total)} · ${vs.length} 段` : ''}</span>
            <button class="ml-auto chip" data-act="new-visit">＋ 補登</button>
        </div>`;
    if (!vs.length) {
        html += `<div class="card text-sm text-slate-400 text-center">尚無行程。${k === dayKey() ? '抵達客戶時按上方「抵達打卡」。' : '可按「補登」新增。'}</div>`;
    }
    vs.forEach((v, i) => {
        if (i > 0 && vs[i - 1].leaveAt && v.arriveAt > vs[i - 1].leaveAt) {
            const gap = Math.round((v.arriveAt - vs[i - 1].leaveAt) / 60000);
            html += `<div class="text-center text-xs text-slate-400 py-1">┆ 移動／空檔 ${fmtDur(gap)} ┆</div>`;
        }
        html += `
        <div role="button" tabindex="0" class="card w-full text-left mb-1 block cursor-pointer hover:border-indigo-300 ${v.leavePending ? '!border-amber-300' : ''}" data-act="edit-visit" data-vid="${v.id}">
            <div class="flex items-center gap-2">
                <span class="font-mono text-sm text-slate-600">${hm(v.arriveAt)} – ${v.leaveAt ? hm(v.leaveAt) : '<span class="text-emerald-600">進行中</span>'}</span>
                <span class="ml-auto text-xs font-bold px-2 py-0.5 rounded-full ${v.leaveAt ? 'bg-indigo-50 text-indigo-700' : 'bg-emerald-50 text-emerald-700'}" ${v.leaveAt ? '' : `data-elapsed="${v.arriveAt}"`}>${fmtDur(visitMin(v))}</span>
            </div>
            <div class="font-bold text-base mt-1">${esc(v.place)}${v.geo ? ' <span class="text-xs font-normal text-slate-400">📍</span>' : ''}</div>
            ${v.items.length ? `<ul class="mt-1 text-sm text-slate-600 space-y-0.5">${v.items.map((it) => `
                <li>・${esc(it.text)}${it.result ? `<div class="text-emerald-700 text-xs pl-3">→ ${esc(it.result)}</div>` : ''}</li>`).join('')}</ul>` : ''}
            ${v.note ? `<div class="text-xs text-slate-500 mt-1">備註：${esc(v.note)}</div>` : ''}
            ${v.leaveMode === 'auto' && !v.leavePending ? '<div class="text-[11px] text-slate-400 mt-1">📡 自動偵測離開</div>' : ''}
            ${pendingBlock(v)}
        </div>`;
    });
    html += `</section>`;
    return html;
}

function saveVisitFromModal() {
    const form = $('#visitForm');
    const k = form.dataset.key, vid = form.dataset.vid;
    const placeName = $('#vfPlace').value.trim();
    const a = $('#vfArrive').value, l = $('#vfLeave').value;
    if (!placeName) return toast('請輸入地點');
    if (!a) return toast('請輸入抵達時間');
    const arriveAt = toMs(k, a);
    let leaveAt = l ? toMs(k, l) : null;
    if (leaveAt != null && leaveAt < arriveAt) leaveAt += 86400000; // 跨午夜
    const found = vid ? findVisit(vid) : null;
    const old = found ? found.v : null;
    if (!l && !old) return toast('補登請填寫離開時間');
    if (!l && old && old.leaveAt) return toast('請填寫離開時間');
    if (leaveAt == null) {
        const open = findOpenVisit();
        if (open && open.v.id !== vid) return toast('已有其他進行中的行程');
    }
    const oldItems = old ? Object.fromEntries(old.items.map((i) => [i.id, i])) : {};
    const items = $$('[data-item-row]').map((row) => {
        const text = $('[data-item-text]', row).value.trim();
        if (!text) return null;
        const prev = oldItems[row.dataset.iid];
        return { id: prev ? prev.id : uid(), text, todoId: row.dataset.todo || null, result: prev ? prev.result || '' : '' };
    }).filter(Boolean);
    const p = resolvePlace(placeName);
    const d = ensureDay(k);
    const v = old || { id: uid(), geo: null };
    if (old && leaveAt !== old.leaveAt) v.leaveMode = leaveAt ? 'manual' : null;
    if (!old) v.leaveMode = 'manual';
    if (!leaveAt || (old && leaveAt !== old.leaveAt) || !old || old.leavePending) { v.leavePending = false; v.leaveHints = null; }
    if (!leaveAt) { resetOut(v); v.lastSeenAt = Math.max(v.lastSeenAt || 0, arriveAt); }
    Object.assign(v, { placeId: p.id, place: p.name, arriveAt, leaveAt, items, note: $('#vfNote').value.trim() });
    if (!old) d.visits.push(v);
    d.visits = sortVisits(d.visits);
    save(); closeModal(); render();
    toast(old ? '已更新行程' : '已補登行程');
}

function daySpan(vs) {
    if (!vs.length) return null;
    const first = vs[0].arriveAt;
    const closed = vs.filter((v) => v.leaveAt);
    const last = closed.length ? Math.max(...closed.map((v) => v.leaveAt)) : null;
    return { first, last, open: vs.some((v) => !v.leaveAt) };
}

function buildDayReport(k) {
    const d = getDay(k);
    const vs = sortVisits(d.visits);
    const name = data.settings.name.trim();
    const L = [];
    L.push(`【工作日報】${dateLabel(k)}${name ? ' ' + name : ''}`);
    L.push('');
    if (vs.length) {
        const total = vs.reduce((s, v) => s + visitMin(v), 0);
        const span = daySpan(vs);
        const places = [...new Set(vs.map((v) => v.place))];
        L.push(`■ 工作時段：${hm(span.first)} – ${span.open ? '進行中' : hm(span.last)}`);
        L.push(`■ 駐點合計：${fmtDur(total)}（${vs.length} 段行程；${places.join('、')}）`);
        L.push('');
        L.push('■ 行程與工作內容');
        vs.forEach((v, i) => {
            L.push(`${i + 1}. ${hm(v.arriveAt)}–${v.leaveAt ? hm(v.leaveAt) : '進行中'}（${fmtDur(visitMin(v))}）｜${v.place}`);
            if (!v.items.length) L.push('   ・（未填寫工作內容）');
            v.items.forEach((it) => {
                L.push(`   ・${it.text}`);
                const rs = String(it.result || '').trim();
                if (rs) rs.split(/\r?\n/).forEach((line, j) => L.push(`${j ? '       ' : '     → 成果：'}${line}`));
            });
            if (v.note) L.push(`   備註：${v.note}`);
        });
    } else {
        L.push('■ 本日無行程紀錄');
    }
    if (d.todos.length) {
        const done = d.todos.filter((t) => t.done).length;
        L.push('');
        L.push(`■ 待辦完成情況（${done}/${d.todos.length}）`);
        d.todos.forEach((t) => L.push(`   ${t.done ? '✔' : '☐'} ${t.text}${t.done ? '' : '（未完成）'}`));
    }
    if (d.summary.trim()) {
        L.push('');
        L.push('■ 今日總結');
        d.summary.trim().split(/\r?\n/).forEach((x) => L.push(`   ${x}`));
    }
    const tm = splitLines(d.tomorrow);
    if (tm.length) {
        L.push('');
        L.push('■ 明日計畫');
        tm.forEach((x) => L.push(`   ・${x}`));
    }
    return L.join('\n');
}

function mailSubject(k) {
    return (data.settings.subjectTpl || '【工作日報】{date} {name}')
        .replace(/\{date\}/g, dateLabel(k))

}

function monthStats(ym) {
    const keys = Object.keys(data.days).filter((k) => k.startsWith(ym + '-')).sort();
    const days = [], byPlace = {};
    let total = 0, visits = 0, todoDone = 0, todoAll = 0;
    for (const k of keys) {
        const d = data.days[k];
        const vs = sortVisits(d.visits || []);
        todoAll += d.todos.length; todoDone += d.todos.filter((t) => t.done).length;
        if (!vs.length) continue;
        const mins = vs.reduce((s, v) => s + visitMin(v), 0);
        const span = daySpan(vs);
        total += mins; visits += vs.length;
        for (const v of vs) {
            const p = byPlace[v.place] ||= { place: v.place, mins: 0, visits: 0, days: new Set() };
            p.mins += visitMin(v); p.visits += 1; p.days.add(k);
        }
        days.push({ key: k, vs, mins, span, places: [...new Set(vs.map((v) => v.place))], todos: d.todos });
    }
    const places = Object.values(byPlace).sort((a, b) => b.mins - a.mins);
    return { ym, days, places, total, visits, todoDone, todoAll };
}

}

async function exportFile(name, text, type) {
    const blob = new Blob([text], { type });
    const coarse = window.matchMedia && matchMedia('(pointer: coarse)').matches;
    if (coarse && navigator.canShare) {
        try {
            const file = new File([blob], name, { type });
            if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }
        } catch (e) { if (e.name === 'AbortError') return; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    toast('已下載 ' + name);
}
async function copyText(text) {
    try { await navigator.clipboard.writeText(text); toast('已複製'); }
    catch (e) {
        const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); toast('已複製'); } catch (e2) { toast('複製失敗，請手動選取'); }
        ta.remove();
    }
}

function tickElapsed() {
    $$('[data-elapsed]').forEach((el) => { el.textContent = fmtDur(Math.max(0, Math.round((Date.now() - Number(el.dataset.elapsed)) / 60000))); });
}
setInterval(tickElapsed, 20000);

// ─── 動作 ──────────────────────────────────────────────────────────────
function addItem(vid, item) {
    const f = findVisit(vid); if (!f) return;
    f.v.items.push({ id: uid(), text: item.text, todoId: item.todoId || null, result: '' });
    save(); render();
}
function addTodos(k, texts) {
    const d = ensureDay(k);
    const have = new Set(d.todos.map((t) => t.text));
    let n = 0;
    for (const t of texts) { if (t && !have.has(t)) { d.todos.push({ id: uid(), text: t, done: false }); have.add(t); n++; } }
    save(); render();
    return n;
}

    'tab': (el) => { ui.tab = el.dataset.tab; if (ui.tab === 'today') locate(); render(); window.scrollTo(0, 0); },
    'date-shift': (el) => { ui.date = addDays(ui.date, Number(el.dataset.n)); render(); },

    'goto-date': (el) => { ui.date = el.dataset.key; ui.tab = 'today'; render(); window.scrollTo(0, 0); },
    'month-shift': (el) => {
        const [y, m] = ui.month.split('-').map(Number);

        ui.month = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; render();

    'go-day-report': () => { ui.tab = 'report'; ui.reportMode = 'day'; render(); window.scrollTo(0, 0); },

    'pick-place': (el) => { ui.arrivePlace = el.dataset.id; ui.arriveNew = ''; render(); },
    'arrive-now': () => { ui.arriveTime = null; render(); },
    'relocate': () => locate(true),
    'arrive': () => {
        const k = dayKey();
        const open = findOpenVisit();
        if (open && open.key !== k) return toast('請先處理尚未離開的行程');
        let p = null;
        if (ui.arriveNew.trim()) p = resolvePlace(ui.arriveNew);
        else if (ui.arrivePlace) p = data.places.find((x) => x.id === ui.arrivePlace);
        if (!p) return toast('請選擇或輸入地點');
        const t = ui.arriveTime || nowHM();
        const geo = (data.settings.useGps && ui.geo && Date.now() - ui.geoAt < 10 * 60000) ? { ...ui.geo } : null;
        if (geo && typeof p.lat !== 'number' && geo.acc <= 200) {
            p.lat = geo.lat; p.lng = geo.lng;
            setTimeout(() => toast(`已記住「${p.name}」的座標`), 2300);
        }
        const arriveAt = toMs(k, t);
        let closedMsg = '';
        if (open) {
            // 在新地點打卡時，自動結束上一個行程（離開時間依最後在場時間推算）
            if (arriveAt < open.v.arriveAt) return toast(`抵達時間需晚於「${open.v.place}」的抵達時間 ${hm(open.v.arriveAt)}`);
            const ref = visitRef(open.v);
            resetOut(open.v);
            const est = estimateLeave(open.v, arriveAt, ref && geo ? distM(ref, geo) : null);
            applyLeave(open.v, est, 'auto');
            closedMsg = `，已結束「${open.v.place}」${open.v.leavePending ? '（離開時間待確認）' : ''}`;
        }
        const d = ensureDay(k);
        d.visits.push({ id: uid(), placeId: p.id, place: p.name, arriveAt, leaveAt: null, geo, items: [], note: '', lastSeenAt: arriveAt });
        d.visits = sortVisits(d.visits);
        ui.arrivePlace = null; ui.arriveNew = ''; ui.arriveTime = null; ui.date = k; ui.arriveWhileOpen = false;
        ui.monDist = null; ui.monNote = '';
        save(); render(); window.scrollTo(0, 0);
        toast(`${t} 抵達 ${p.name}${closedMsg}`);
    },
    'leave': (el) => {
        const f = findVisit(el.dataset.vid); if (!f) return;
        const t = $(`#leaveTime-${f.v.id}`).value;
        if (!t) return toast('請輸入離開時間');
        let leaveAt = toMs(f.key, t);
        if (leaveAt < f.v.arriveAt) leaveAt += 86400000;
        if (leaveAt - f.v.arriveAt > 24 * 3600000) return toast('停留時間超過 24 小時，請確認時間');
        f.v.leaveAt = leaveAt; f.v.leaveMode = 'manual'; f.v.leavePending = false; f.v.leaveHints = null; resetOut(f.v);
        save(); render();
        toast(`離開 ${f.v.place}，停留 ${fmtDur(visitMin(f.v))}`);
        if (ui.tab === 'today' && f.key === dayKey()) locate(true);
    },
    'arrive-other': () => { ui.arriveWhileOpen = true; render(); window.scrollTo(0, 0); locate(); },
    'arrive-other-cancel': () => { ui.arriveWhileOpen = false; render(); },
    'fix-leave': (el) => {
        const f = findVisit(el.dataset.vid); if (!f) return;
        f.v.leaveAt = Math.max(Number(el.dataset.at), f.v.arriveAt);
        f.v.leavePending = false; f.v.leaveHints = null;
        save(); render(); toast(`離開時間已確認為 ${hm(f.v.leaveAt)}`);

    'lp-set': (el) => { $('#lpTime').value = hm(Number(el.dataset.at)); },
    'lp-stay': () => {
        const f = findVisit($('#leavePrompt').dataset.vid); closeModal();

        const box = $('#leavePrompt');

        if (!t) return toast('請輸入離開時間');

        if (at < f.v.arriveAt) at += 86400000;
        applyLeave(f.v, { at, precise: true }, 'prompt');

    'del-item': (el) => {

    'add-todo': () => {

    'toggle-todo': (el) => {
        const d = ensureDay(el.dataset.key);
        const t = d.todos.find((x) => x.id === el.dataset.id);
        if (t) { t.done = !t.done; save(); render(); }
    },
    'del-todo': (el) => {
        const d = ensureDay(el.dataset.key);
        d.todos = d.todos.filter((x) => x.id !== el.dataset.id);
        save(); render();
    },
    'carry-over': (el) => {
        const k = el.dataset.key;
        let prev = null;
        for (let i = 1; i <= 31; i++) {
            const pk = addDays(k, -i), pd = data.days[pk];
            if (pd && (pd.todos.length || pd.visits.length || pd.tomorrow)) { prev = { pk, pd }; break; }
        }
        if (!prev) return toast('找不到前一個有紀錄的工作日');
        const texts = [...prev.pd.todos.filter((t) => !t.done).map((t) => t.text), ...splitLines(prev.pd.tomorrow)];
        if (!texts.length) return toast(`${shortDate(prev.pk)} 沒有未完成待辦或明日計畫`);
        const n = addTodos(k, texts);

    'new-visit': () => openVisitEditor(null),

});

// 文字輸入：即時存入資料，不重新渲染（避免失去焦點）
document.addEventListener('input', (e) => {
    const el = e.target, b = el.dataset && el.dataset.bind;
    if (!b) return;
    const val = el.value;
    if (b === 'arriveNew') {
        ui.arriveNew = val;
        $$('[data-act="pick-place"]').forEach((c) => c.classList.toggle('on', !val.trim() && c.dataset.id === ui.arrivePlace));
        return;
    }
    if (b === 'arriveTime') { ui.arriveTime = val || null; return; }
    if (b === 'summary' || b === 'tomorrow') { ensureDay(ui.date)[b] = val; save(); return; }
    if (b === 'result') {
        const f = findVisit(el.dataset.vid); if (!f) return;
        const it = f.v.items.find((i) => i.id === el.dataset.iid); if (it) { it.result = val; save(); }
        return;
    }
    if (b.startsWith('set-num-')) {
        const n = Math.round(Number(val));
        if (n >= 100 && n <= 50000) { data.settings[b.slice(8)] = n; save(); }
        return;
    }
    if (b.startsWith('set-')) { data.settings[b.slice(4)] = val; save(); return; }
    if (b === 'place-name') {
        const p = data.places.find((x) => x.id === el.dataset.id);
        if (p && val.trim()) { p.name = val.trim(); save(); }
        return;
    }
    if (b === 'tpl-text') {
        const t = data.templates.find((x) => x.id === el.dataset.id);
        if (t && val.trim()) { t.text = val.trim(); save(); }
    }
});

document.addEventListener('change', (e) => {
    const c = e.target.dataset && e.target.dataset.change;
    if (c === 'date' && e.target.value) { ui.date = e.target.value; render(); }
    if (c === 'month' && e.target.value) { ui.month = e.target.value; render(); }
    if (e.target.dataset && /^set-num-/.test(e.target.dataset.bind || '')) {
        const st = data.settings;
        st.promptDist = Math.max(100, st.promptDist || 300);
        if (!(st.autoDist > st.promptDist)) { st.autoDist = st.promptDist + 500; toast('自動離開距離需大於提示距離，已自動調整'); }
        save(); render();
    }
});

// Enter 送出（textarea 需不按 Shift；中文輸入法組字中不觸發）
document.addEventListener('keydown', (e) => {
    const el = e.target, a = el.dataset && el.dataset.enter;
    if (!a || e.key !== 'Enter' || e.isComposing || e.keyCode === 229) return;
    if (el.tagName === 'TEXTAREA' && e.shiftKey) return;
    e.preventDefault();
    const fn = actions[a];
    if (fn) fn(el, e);
});

// 匯入 JSON
$('#importFile').addEventListener('change', async (e) => {
    const file = e.target.files[0]; if (!file) return;
    let incoming;
    try { incoming = normalize(JSON.parse(await file.text())); }
    catch (err) { return toast('檔案格式錯誤'); }
    const mode = e.target.dataset.mode;
    if (mode === 'replace') {
        if (!confirm(`以備份檔取代目前全部資料（備份含 ${Object.keys(incoming.days).length} 天）？`)) return;
        data = incoming;
    } else {
        // 合併：同一天以「行程 id／待辦 id」去重，備份檔的設定只補空白欄位
        for (const [k, d] of Object.entries(incoming.days)) {
            const cur = ensureDay(k);
            for (const t of d.todos || []) if (!cur.todos.some((x) => x.id === t.id)) cur.todos.push(t);
            for (const v of d.visits || []) if (!cur.visits.some((x) => x.id === v.id)) cur.visits.push(v);
            cur.visits = sortVisits(cur.visits);
            if (!cur.summary && d.summary) cur.summary = d.summary;
            if (!cur.tomorrow && d.tomorrow) cur.tomorrow = d.tomorrow;
        }
        for (const p of incoming.places) if (!data.places.some((x) => x.id === p.id || x.name === p.name)) data.places.push(p);
        for (const t of incoming.templates) if (!data.templates.some((x) => x.id === t.id || x.text === t.text)) data.templates.push(t);
        for (const [key, val] of Object.entries(incoming.settings)) if (!data.settings[key] && val) data.settings[key] = val;
    }
    save(true); render(); toast('匯入完成');
});

// 回到前景時更新畫面（跨日、計時）
document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    if (!$('#modal').innerHTML && !document.activeElement.matches('input, textarea')) render();
    else tickElapsed();
    if (ui.tab === 'today') locate();
    pollOnce();   // 重新開啟 App：立即補判是否已離開
});
document.addEventListener('visibilitychange', syncMonitor);

render();
if (ui.tab === 'today') locate();
</script>

        window.addEventListener('load', () =>
            navigator.serviceWorker.register('./sw.js')
                .catch((err) => console.warn('[SW] Registration failed:', err))
        );
    }
</script>
